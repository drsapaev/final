[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -m "not gate_d"
markers =
    asyncio: asynchronous tests
    unit: unit tests
    integration: integration tests
    e2e: end-to-end (E2E) tests
    slow: slow tests
    security: security tests
    migration: migration tests
    confirmation: visit confirmation tests
    queue: queue tests
    gate_d: Gate D transaction/locking runtime tests (require PostgreSQL + independent sessions)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
