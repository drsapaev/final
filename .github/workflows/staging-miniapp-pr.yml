          import selectors
          import socket
          import socketserver
          import sys

          bind, upstream = sys.argv[1:]

          class Relay(socketserver.BaseRequestHandler):
              def handle(self):
                  try:
                      with socket.create_connection((upstream, 443), timeout=8) as remote, selectors.DefaultSelector() as selector:
                          self.request.settimeout(30)
                          selector.register(self.request, selectors.EVENT_READ, remote)
                          selector.register(remote, selectors.EVENT_READ, self.request)
                          while events := selector.select(timeout=30):
                              for key, _ in events:
                                  data = key.fileobj.recv(65536)
                                  if not data:
                                      return
                                  key.data.sendall(data)
                  except OSError:
