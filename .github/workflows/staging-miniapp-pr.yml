          query=$(cat <<'SQL'
          SELECT EXISTS (
            SELECT 1 FROM patient_access_audit_logs login
            JOIN patient_access_audit_logs refresh ON refresh.session_id = login.session_id
            JOIN patient_access_audit_logs revoke ON revoke.session_id = login.session_id
            JOIN patient_access_audit_logs logout ON logout.session_id = login.session_id
            JOIN patient_access_audit_logs second
              ON second.subject_patient_id = login.subject_patient_id
              AND second.session_id <> login.session_id
            JOIN telegram_mini_app_sessions victim ON victim.id::text = second.session_id
            WHERE login.resource_type = 'session_management' AND login.action = 'login'
              AND login.outcome = 'success'
              AND second.resource_type = 'session_management' AND second.action = 'login'
              AND second.outcome = 'success' AND second.timestamp < revoke.timestamp
              AND refresh.resource_type = 'session_management' AND refresh.action = 'refresh'
              AND refresh.outcome = 'success'
              AND refresh.timestamp >= login.timestamp + interval '15 minutes'
              AND revoke.resource_type = 'session_management' AND revoke.action = 'revoke'
              AND revoke.outcome = 'success' AND revoke.extra_data->>'revoked_count' = '1'
              AND revoke.timestamp >= refresh.timestamp
              AND (SELECT count(*) FROM telegram_mini_app_sessions sessions
                   WHERE sessions.patient_id = login.subject_patient_id) = 2
              AND victim.patient_id = login.subject_patient_id
              AND victim.revoked_at BETWEEN refresh.timestamp AND revoke.timestamp
              AND logout.resource_type = 'session_management' AND logout.action = 'logout'
              AND logout.outcome = 'success' AND logout.extra_data->>'revoked_count' = '1'
              AND logout.timestamp > revoke.timestamp
          );
          SQL
          )
          deadline=$((SECONDS + 1500))
          while (( SECONDS < deadline )); do
            kill -0 "$connector" 2>/dev/null || exit 1
            evidence="$(timeout 10s "$d/compose" exec -T postgres psql -XAt \
              --set ON_ERROR_STOP=on -U miniapp_synthetic -d miniapp_synthetic -c "$query" 2>/dev/null)"
            if [[ "$evidence" == t ]]; then
              printf 'Session audit PASS for 33f35996: two logins, refresh after 15 minutes, one other session revoked, current session logged out. Operator confirmation of the Telegram UI is recorded separately.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          printf 'Native acceptance incomplete. Expected session evidence was missing at timeout.\n' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Process one versioned visit reminder through ARQ and Telegram
        if: env.RUN_ARQ_ACCEPTANCE == 'true'
        shell: bash
        env:
          ARQ_STAGING_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          project="miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -n "$ARQ_STAGING_BOT_TOKEN"
          token=$ARQ_STAGING_BOT_TOKEN
          unset ARQ_STAGING_BOT_TOKEN

          # The preceding step verified the public connector shut down. Stop
          # the local ingress too before granting the isolated worker egress.
          "$d/compose" stop gateway >/dev/null
          test "$("$d/compose" ps --services --status running | sort)" = $'backend\nfrontend\npostgres\nredis'
          test "$(docker image inspect --format '{{.Id}}' "$project-backend")" = \
            "$(docker inspect --format '{{.Image}}' "$("$d/compose" ps -q backend)")"
          upstream=$(getent ahostsv4 api.telegram.org | awk '$2 == "STREAM" && !seen++ {print $1}')
          python3 -c 'import ipaddress, sys; assert ipaddress.IPv4Address(sys.argv[1]).is_global' "$upstream"

          cat > "$d/telegram-relay.py" <<'PY'
          import selectors
          import socket
          import socketserver
          import sys

          bind, upstream = sys.argv[1:]

          class Relay(socketserver.BaseRequestHandler):
              def handle(self):
                  try:
                      with socket.create_connection((upstream, 443), timeout=8) as telegram, selectors.DefaultSelector() as watch:
                          self.request.settimeout(10)
                          watch.register(self.request, selectors.EVENT_READ, telegram)
                          watch.register(telegram, selectors.EVENT_READ, self.request)
                          while events := watch.select(timeout=12):
                              for key, _ in events:
                                  chunk = key.fileobj.recv(65536)
                                  if not chunk:
                                      return
                                  key.data.sendall(chunk)
                  except OSError:
                      return

          with socketserver.ThreadingTCPServer((bind, 443), Relay) as server:
              server.daemon_threads = True
              server.serve_forever()
          PY
          chmod 444 "$d/telegram-relay.py"
          cat > "$d/arq.yml" <<YAML
          services:
            worker:
              image: $project-backend
              build: !reset null
              cap_drop: [ALL]
              volumes: !reset []
              dns: [127.0.0.1]
              networks: [default, reminder]
              extra_hosts:
                api.telegram.org: 172.30.242.2
              environment:
                TELEGRAM_BOT_TOKEN: \${ARQ_STAGING_BOT_TOKEN:-}
            telegram-relay:
              image: $project-backend
              entrypoint: [python, /relay.py, 172.30.242.2, "$upstream"]
              user: "65534:65534"
              volumes:
                - $d/telegram-relay.py:/relay.py:ro
              cap_drop: [ALL]
              sysctls:
                net.ipv4.ip_unprivileged_port_start: 443
              networks:
                reminder:
                  ipv4_address: 172.30.242.2
                ingress: {}
          networks:
            reminder:
              internal: true
              ipam:
                config:
                  - subnet: 172.30.242.0/28
          YAML
          ARQ_STAGING_BOT_TOKEN=arq-synthetic-marker "$d/compose" -f "$d/arq.yml" config --format json | python3 -c '
          import json, sys
          c = json.load(sys.stdin)
          s = c["services"]
          worker, relay = s["worker"], s["telegram-relay"]
          assert not any(n.get("external") for n in c["networks"].values())
          assert all(c["networks"][n]["internal"] is True for n in ("default", "reminder"))
          assert set(worker["networks"]) == {"default", "reminder"}
          assert set(relay["networks"]) == {"reminder", "ingress"}
          assert all(not s[n].get("ports") and not s[n].get("privileged") for n in ("worker", "telegram-relay"))
          assert not worker.get("build") and not worker.get("volumes") and worker["dns"] == ["127.0.0.1"]
          assert relay["volumes"][0]["read_only"] is True
          assert worker["environment"]["TELEGRAM_BOT_TOKEN"] == "arq-synthetic-marker"
          assert all("arq-synthetic-marker" not in json.dumps(v) for k, v in s.items() if k != "worker")
          '

          "$d/compose" -f "$d/arq.yml" up -d --no-deps --no-build --pull never telegram-relay
          run_worker=("$d/compose" -f "$d/arq.yml" run --rm --no-deps --pull never -T --entrypoint python worker)
          "${run_worker[@]}" -c '
          import os, socket, ssl, time
          assert not os.environ.get("TELEGRAM_BOT_TOKEN")
          assert socket.gethostbyname("api.telegram.org") == "172.30.242.2"
          for attempt in range(8):
              try:
                  with socket.create_connection(("api.telegram.org", 443), timeout=5) as tcp:
                      with ssl.create_default_context().wrap_socket(tcp, server_hostname="api.telegram.org"):
                          break
              except OSError:
                  if attempt == 7:
                      raise
                  time.sleep(1)
          '

          helper=$(cat "$d/arq-check.py")
          if ! "$d/compose" exec -T backend python -c "$helper" enqueue "$REVIEWED_SHA" >/dev/null 2>&1; then
            echo '::error::Could not enqueue the single versioned synthetic reminder.'
            exit 1
          fi
          if ! ARQ_STAGING_BOT_TOKEN="$token" "${run_worker[@]}" -c "$helper" worker "$REVIEWED_SHA" >/dev/null 2>&1; then
            echo '::error::ARQ worker failed or delivery is uncertain; investigate before another attempt.'
            exit 1
          fi
          unset token
          if ! "$d/compose" exec -T backend python -c "$helper" verify "$REVIEWED_SHA" >/dev/null 2>&1; then
            echo '::error::ARQ result or PostgreSQL delivery stamp is missing; investigate before retrying.'
            exit 1
          fi
          printf 'ARQ schedule-versioned Telegram reminder and PostgreSQL delivery stamp: PASS on `%s`. Confirm the single synthetic reminder in the approved test chat.\n' "$REVIEWED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove exactly this isolated stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          project="miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result=PASS
          if [[ -x "$d/compose" ]]; then
            overrides=()
            if [[ -f "$d/arq.yml" ]]; then overrides=(-f "$d/arq.yml"); fi
            "$d/compose" "${overrides[@]}" down --volumes --remove-orphans --rmi local || result=FAIL
          fi
          # The frontend has an explicit project-owned tag; Compose can keep it.
          if docker image inspect "$project-frontend" >/dev/null 2>&1; then
            docker image rm "$project-frontend" || result=FAIL
          fi
          for type in container network volume image; do
            opts=(-q)
            if [[ "$type" == container || "$type" == image ]]; then opts+=(-a); fi
            if ! remaining="$(docker "$type" ls "${opts[@]}" --filter "label=com.docker.compose.project=$project")" || [[ -n "$remaining" ]]; then
              result=FAIL
            fi
          done
          if docker image inspect "$project-backend" >/dev/null 2>&1; then result=FAIL; fi
          rm -rf -- "$d" || result=FAIL
          printf 'Isolated Mini App teardown: %s.\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          test "$result" = PASS
