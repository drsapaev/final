          import http.client
          import json
          import sys
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path

          PATH = "/api/v1/telegram/webhook"
          CHAT_FILE = Path("/run/secrets/approved-chat-id")
          ALLOWED = frozenset({
              "/start", "/start@kosmed_staging_bot",
              "⚙️ Настройки", "⚙️ Sozlamalar",
              "🇺🇿 O'zbekcha", "🇷🇺 Русский",
          })
          LIMIT = 32 * 1024

          def sanitize(update, approved):
              if not isinstance(update, dict) or set(update) != {"update_id", "message"}:
                  return None
              message = update.get("message")
              if not isinstance(message, dict):
                  return None
              chat, sender = message.get("chat"), message.get("from")
              if not isinstance(chat, dict) or not isinstance(sender, dict):
                  return None
              try:
                  chat_id, sender_id = int(chat.get("id")), int(sender.get("id"))
                  update_id = int(update["update_id"])
                  message_id, message_date = int(message["message_id"]), int(message["date"])
              except (KeyError, TypeError, ValueError):
                  return None
              if (chat_id != approved or sender_id != approved
                      or chat.get("type") != "private" or sender.get("is_bot") is not False):
                  return None
              text = message.get("text")
              if not isinstance(text, str) or text not in ALLOWED:
                  return None
              clean = {
                  "update_id": update_id,
                  "message": {
                      "message_id": message_id,
                      "date": message_date,
                      "chat": {"id": approved, "type": "private"},
                      "from": {
                          "id": approved,
                          "is_bot": False,
                          "first_name": "SYNTHETIC-STAGING",
                          "language_code": "ru",
                      },
                      "text": text,
                  },
              }
              entities = []
              for entity in message.get("entities", []):
                  if (isinstance(entity, dict) and entity.get("type") == "bot_command"
                          and entity.get("offset") == 0
                          and isinstance(entity.get("length"), int)
                          and 0 < entity["length"] <= len(text)):
                      entities.append({"type": "bot_command", "offset": 0, "length": entity["length"]})
              if entities:
                  clean["message"]["entities"] = entities
              return clean

          def self_test():
              cid = 123456789
              sample = {
                  "update_id": 1,
                  "message": {
                      "message_id": 2, "date": 3,
                      "chat": {"id": cid, "type": "private", "first_name": "PRIVATE NAME"},
                      "from": {"id": cid, "is_bot": False, "first_name": "PRIVATE NAME",
                               "last_name": "PRIVATE", "username": "private_user"},
                      "text": "/start",
                      "entities": [{"type": "bot_command", "offset": 0, "length": 6}],
                  },
              }
              clean = sanitize(sample, cid)
              encoded = json.dumps(clean, ensure_ascii=False)
              assert clean is not None
              assert "PRIVATE" not in encoded and "private_user" not in encoded
              assert "last_name" not in encoded and "username" not in encoded
              assert clean["message"]["from"]["first_name"] == "SYNTHETIC-STAGING"
              assert sanitize(sample, cid + 1) is None
              other = json.loads(json.dumps(sample))
              other["message"]["from"]["id"] = cid + 1
              assert sanitize(other, cid) is None
              group = json.loads(json.dumps(sample))
              group["message"]["chat"]["type"] = "group"
              assert sanitize(group, cid) is None
              free_text = json.loads(json.dumps(sample))
              free_text["message"]["text"] = "SYNTHETIC CHECK"
              assert sanitize(free_text, cid) is None
              contact = json.loads(json.dumps(sample))
              del contact["message"]["text"]
              contact["message"]["contact"] = {"phone_number": "0000000000"}
              assert sanitize(contact, cid) is None
              print("PASS: webhook recipient allowlist and identity scrubbing.")
              return

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"

              def log_message(self, _format, *_args):
                  return

              def respond(self, status, body=b'{"ok":false}'):
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(body)

              def do_POST(self):
                  if self.path != PATH:
                      self.respond(404)
                      return
                  try:
                      size = int(self.headers.get("Content-Length", ""))
                  except ValueError:
                      self.respond(400)
                      return
                  if not 0 < size <= LIMIT:
                      self.respond(413)
                      return
                  try:
                      request = json.loads(self.rfile.read(size))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      self.respond(400)
                      return
                  cleaned = sanitize(request, self.server.approved_chat_id)
                  if cleaned is None:
                      self.respond(503)
                      return
                  secret = self.headers.get("X-Telegram-Bot-Api-Secret-Token", "")
                  if not secret or len(secret) > 256:
                      self.respond(403)
                      return
                  payload = json.dumps(cleaned, separators=(",", ":"), ensure_ascii=False).encode()
                  upstream = http.client.HTTPConnection("backend", 18000, timeout=10)
                  try:
                      upstream.request("POST", PATH, body=payload, headers={
                          "Content-Type": "application/json",
                          "X-Telegram-Bot-Api-Secret-Token": secret,
                          "X-Forwarded-Proto": "https",
                          "Host": "miniapp-staging.finalclinic.fyi",
                      })
                      result = upstream.getresponse()
                      body = result.read(LIMIT + 1)
                      if len(body) > LIMIT:
                          self.respond(502)
                      else:
                          self.respond(result.status, body or b'{"ok":true}')
                  except (OSError, http.client.HTTPException):
                      self.respond(503)
                  finally:
                      upstream.close()

              def do_GET(self):
                  self.respond(404)

              def do_PUT(self):
                  self.respond(404)

              def do_DELETE(self):
                  self.respond(404)

          def main():
              if sys.argv[1:] == ["--self-test"]:
                  self_test()
                  return
              try:
                  value = CHAT_FILE.read_text(encoding="ascii").strip()
                  if not value.isdecimal():
                      raise ValueError
                  approved = int(value)
                  if not 0 < approved < 2**52:
                      raise ValueError
              except (OSError, UnicodeError, ValueError):
                  raise SystemExit("private staging chat is unavailable")
              server = HTTPServer(("0.0.0.0", 18087), Handler)
              server.approved_chat_id = approved
              server.serve_forever()

          if __name__ == "__main__":
              main()
          PY
