              pr["number"] == 4271 and pr["state"] == "open" and not pr["draft"]
              and pr["mergeable"] is True
              and head["repo"]["full_name"] == base["repo"]["full_name"] == "drsapaev/final"
              and head["ref"] == "codex/telegram-patient-menu"
              and base["ref"] == "main"
              and head["sha"] == sys.argv[1]
