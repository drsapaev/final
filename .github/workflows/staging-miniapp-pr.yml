          TELEGRAM_BOT_TOKEN= "$d/compose" up -d --no-build --pull never --wait --wait-timeout 280 postgres redis backend frontend
          "$d/compose" exec -T backend sh -ec 'test -z "${TELEGRAM_BOT_TOKEN:-}"'

      - name: Verify Mini App revision and reject out-of-scope requests
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sha=33f35996a1f86726b17f8caa819d1ed99aa1729a
          host=miniapp-staging.finalclinic.fyi
          patient=/telegram/mini-app/patient
          cabinet="$patient?section=cabinet"
          "$d/compose" exec -T postgres psql -XAt --set ON_ERROR_STOP=on \
            -U miniapp_synthetic -d miniapp_synthetic -c 'select count(*) from patients' | grep -Fxq 0
          "$d/compose" exec -T backend python -c "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:18000/', timeout=10))['version'] == '$sha'"
          "$d/compose" exec -T frontend grep -Fq "const BUILD_VERSION = '$sha';" /usr/share/nginx/html/sw.js
          "$d/compose" exec -T frontend find /usr/share/nginx/html/assets -type f > "$d/asset-list"
          python3 - "$d" <<'PY'
          from pathlib import Path
          import re
          import sys

          d = Path(sys.argv[1])
          root = "/usr/share/nginx/html"
          assets = sorted({p.removeprefix(root) for p in (d / "asset-list").read_text().splitlines()})
          assert 0 < len(assets) <= 1000
          assert all(re.fullmatch(r"/assets/[A-Za-z0-9._-]+", p) for p in assets)
          prefix = "/api/v1/telegram/mini-app/"
          exact_api = ("auth/exchange", "auth/refresh", "auth/logout", "sessions/list",
                       "sessions/revoke-all", "patient/manifest", "cabinet/summary")
          routes = [
              '    "GET:/telegram/mini-app/patient" static;',
              '    "GET:/telegram/mini-app/patient?section=cabinet" static;',
              '    "GET:/favicon.svg" static;',
              '    "GET:/api/v1/auth/csrf-token" api;',
              *[f'    "GET:{path}" static;' for path in assets],
              *[f'    "POST:{prefix}{path}" api;' for path in exact_api],
              '    ~^POST:/api/v1/telegram/mini-app/sessions/[a-f0-9-][a-f0-9-]*/revoke$ api;',
          ]
          conf = r"""
          map_hash_bucket_size 256;
          map_hash_max_size 4096;
          map "$request_method:$request_uri" $destination {
              default denied;
          ROUTES
          }
          map $destination $upstream_name {
              default "";
              static frontend:80;
              api backend:18000;
          }
          server {
              listen 80 default_server;
              server_name miniapp-staging.finalclinic.fyi;
              access_log off;
              error_log /dev/null;
              client_max_body_size 32k;
              resolver 127.0.0.11 ipv6=off;
              if ($http_host != miniapp-staging.finalclinic.fyi) { return 404; }
              if ($destination = denied) { return 404; }
              location / {
                  proxy_pass http://$upstream_name$request_uri;
                  proxy_set_header Host miniapp-staging.finalclinic.fyi;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-Host miniapp-staging.finalclinic.fyi;
                  proxy_set_header X-Forwarded-For "";
                  proxy_set_header Upgrade "";
                  proxy_set_header Connection close;
                  proxy_hide_header Cache-Control;
                  add_header Cache-Control "no-store, private" always;
              }
          }
          """
          (d / "ingress.conf").write_text(conf.replace("ROUTES", "\n".join(routes)))
          PY
          "$d/compose" up -d --no-deps --no-build --pull never gateway
          ready=false
          status=000
          for _ in {1..30}; do
            status="$(curl -sS --max-time 3 -H "Host: $host" -D "$d/headers" -o "$d/page" -w '%{http_code}' "http://127.0.0.1:18086$cabinet" 2>/dev/null || true)"
            if [[ "$status" == 200 ]]; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Loopback Cabinet did not become ready (HTTP $status)."
            "$d/compose" logs --no-color --tail 15 gateway || true
            exit 1
          fi
          grep -iE '^content-security-policy:.*https://telegram\.org/js/telegram-web-app\.js' "$d/headers" >/dev/null
          grep -iE '^cache-control:.*no-store' "$d/headers" >/dev/null
          grep -qiE '^cross-origin-embedder-policy: require-corp' "$d/headers"
          script_path="$(sed -nE 's@.*src="(/assets/[A-Za-z0-9._-]+\.js)".*@\1@p' "$d/page" | head -n1)"
          test -n "$script_path"
          curl -fsS --max-time 10 -H "Host: $host" "http://127.0.0.1:18086$script_path" -o "$d/bundle.js"
          expected_hash="$("$d/compose" exec -T frontend sha256sum "/usr/share/nginx/html$script_path" | cut -d' ' -f1)"
          test "$(sha256sum "$d/bundle.js" | cut -d' ' -f1)" = "$expected_hash"
          for denied in / /docs /openapi.json /api/v1/auth/me /api/v1/patients /sw.js /assets/not-built.js "$patient?not=allowed"; do
            test "$(curl -sS --max-time 5 -H "Host: $host" -o /dev/null -w '%{http_code}' "http://127.0.0.1:18086$denied")" = 404
          done
          test "$(curl -sS --max-time 5 -H 'Host: unrelated.invalid' -o /dev/null -w '%{http_code}' "http://127.0.0.1:18086$patient")" = 404
          test "$(curl -sS --max-time 5 -H "Host: $host" -X POST -o /dev/null -w '%{http_code}' "http://127.0.0.1:18086$patient")" = 404
          status="$(curl -sS --max-time 5 -H "Host: $host" -H 'Content-Type: application/json' --data '{}' -o "$d/csrf.json" -w '%{http_code}' "http://127.0.0.1:18086/api/v1/telegram/mini-app/auth/exchange")"
          test "$status" = 403
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["reason"] == "missing_cookie"' "$d/csrf.json"
          curl -fsS --max-time 5 -H "Host: $host" "http://127.0.0.1:18086/api/v1/auth/csrf-token" -o "$d/bootstrap.json"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["csrf_token"]' "$d/bootstrap.json"
          test "$("$d/compose" ps --services --status running | sort)" = $'backend\nfrontend\ngateway\npostgres\nredis'
          printf 'Loopback Mini App ingress and CSRF: PASS at `%s`. Public HTTPS and native Telegram: NOT_RUN.\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove exactly this isolated stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          project="miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result=PASS
          if [[ -x "$d/compose" ]]; then
            "$d/compose" down --volumes --remove-orphans --rmi local || result=FAIL
          fi
          # The frontend has an explicit project-owned tag; Compose can keep it.
          if docker image inspect "$project-frontend" >/dev/null 2>&1; then
            docker image rm "$project-frontend" || result=FAIL
          fi
          for type in container network volume image; do
            opts=(-q)
            if [[ "$type" == container || "$type" == image ]]; then opts+=(-a); fi
            if ! remaining="$(docker "$type" ls "${opts[@]}" --filter "label=com.docker.compose.project=$project")" || [[ -n "$remaining" ]]; then
              result=FAIL
            fi
          done
          if docker image inspect "$project-backend" >/dev/null 2>&1; then result=FAIL; fi
          rm -rf -- "$d" || result=FAIL
          printf 'Isolated Mini App teardown: %s.\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          test "$result" = PASS

  native-protected-rehearsal:
    if: >-
      github.repository == 'drsapaev/final' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.native-protected || inputs.native-live || inputs.native-arq) &&
      !inputs.native-rehearsal &&
      (!inputs.native-lab-arq || inputs.native-arq) &&
      (!(inputs.native-live || inputs.native-arq) ||
       (github.workflow_ref == 'drsapaev/final/.github/workflows/staging-miniapp-native-live.yml@refs/heads/main' &&
        !inputs.native-protected &&
        ((inputs.native-live && !inputs.native-arq && inputs.source-sha == '33f35996a1f86726b17f8caa819d1ed99aa1729a') ||
         (inputs.native-arq && !inputs.native-live))))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.native-live || inputs.native-arq) && 65 || 35 }}
    environment: staging-integrations
    permissions:
      pull-requests: read
    env:
      REVIEWED_SHA: ${{ !inputs.native-arq && '33f35996a1f86726b17f8caa819d1ed99aa1729a' || inputs.source-sha }}
      RUN_ARQ_ACCEPTANCE: ${{ inputs.native-arq }}
      RUN_LAB_ARQ_ACCEPTANCE: ${{ inputs.native-lab-arq }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Verify the exact PR 4251 metadata
        if: env.RUN_LAB_ARQ_ACCEPTANCE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::PR #4251 acceptance requires its full current head SHA.'
            exit 1
          fi
          # The PR's REST base.sha can lag main. The checkout step verifies the
          # live refs/heads/main against WORKFLOW_SHA before building anything.
          if ! gh api --hostname github.com repos/drsapaev/final/pulls/4251 | python3 -c '
          import json
          import sys

          pr = json.load(sys.stdin)
          head, base = pr["head"], pr["base"]
          sys.exit(not (
              pr["number"] == 4251 and pr["state"] == "open"
              and head["repo"]["full_name"] == base["repo"]["full_name"] == "drsapaev/final"
              and head["ref"] == "codex/laboratory-panel-v2" and base["ref"] == "main"
              and head["sha"] == sys.argv[1]
          ))
          ' "$REVIEWED_SHA" 2>/dev/null; then
            echo '::error::Could not verify open same-repository PR #4251, its exact app head and expected base branch.'
            exit 1
          fi

      - name: Verify the current PR 4195 metadata
        if: env.RUN_ARQ_ACCEPTANCE == 'true' && env.RUN_LAB_ARQ_ACCEPTANCE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api --hostname github.com repos/drsapaev/final/pulls/4195 | python3 -c '
          import json
          import sys

          pr = json.load(sys.stdin)
          head, base = pr["head"], pr["base"]
          sys.exit(not (
              pr["number"] == 4195 and pr["state"] == "open"
              and head["repo"]["full_name"] == base["repo"]["full_name"] == "drsapaev/final"
              and head["ref"] == "codex/kosmed-shell-robots-20261122" and base["ref"] == "main"
              and head["sha"] == sys.argv[1] and base["sha"] == sys.argv[2]
          ))
          ' "$REVIEWED_SHA" "$WORKFLOW_SHA" 2>/dev/null; then
            echo '::error::Could not verify the current open same-repository PR #4195 head and main base.'
            exit 1
          fi

      - name: Prepare exact isolated backend, frontend and ingress
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sha=$REVIEWED_SHA
          host=miniapp-staging.finalclinic.fyi
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          project="miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$d"
          source="$d/source"
          origin=https://github.com/drsapaev/final.git
          git init -q "$source"
          if [[ "$RUN_LAB_ARQ_ACCEPTANCE" == true ]]; then
            # One reviewed integration commit; it must also be the live PR head.
            pinned_app=1c71e26702fb3f739364e71f6bdf45e8d790a77f
            review_base=9ffa1f28747c26524b169bc03363464e3a2add94
            for revision in "$sha" "$WORKFLOW_SHA"; do
              if [[ ! "$revision" =~ ^[a-f0-9]{40}$ ]]; then
                echo '::error::Full PR #4251 app and workflow commit SHAs are required.'
                exit 1
              fi
            done
            if [[ "$sha" != "$pinned_app" ]]; then
              echo '::error::PR #4251 acceptance only admits the exact reviewed integration commit.'
              exit 1
            fi
            git -C "$source" fetch -q --no-tags --depth=64 "$origin" \
              refs/heads/main:refs/remotes/origin/main \
              refs/heads/codex/laboratory-panel-v2:refs/remotes/origin/laboratory-panel-v2 \
              refs/pull/4251/head:refs/remotes/origin/pr-4251
            if [[ "$(git -C "$source" rev-parse refs/remotes/origin/main)" != "$WORKFLOW_SHA" ||
                  "$(git -C "$source" rev-parse refs/remotes/origin/laboratory-panel-v2)" != "$sha" ||
                  "$(git -C "$source" rev-parse refs/remotes/origin/pr-4251)" != "$sha" ]] ||
              ! git -C "$source" merge-base --is-ancestor "$review_base" "$sha" ||
              ! git -C "$source" merge-base --is-ancestor "$review_base" "$WORKFLOW_SHA"; then
              echo '::error::PR #4251 or main changed, or the candidate lacks the reviewed base.'
              exit 1
            fi
            # Main may add this reviewed pin, but may not change the application,
            # the entry workflow, or its trusted runtime helper after review.
            if ! git -C "$source" diff --quiet --no-ext-diff --no-textconv --no-renames \
              --ignore-submodules=none "$review_base" "$WORKFLOW_SHA" -- . \
              ':(top,exclude,literal).github/workflows/staging-miniapp-pr.yml'; then
              echo '::error::Current main differs from the reviewed base outside the single pin workflow.'
              exit 1
            fi
            git -C "$source" show "$WORKFLOW_SHA:ops/scripts/staging_miniapp_arq_check.py" > "$d/arq-check.py"
            test -s "$d/arq-check.py"
            printf 'PR #4251 source verification: PASS at `%s` (reviewed app `%s`, review base `%s`, current workflow `%s`).\n' \
              "$sha" "$pinned_app" "$review_base" "$WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RUN_ARQ_ACCEPTANCE" == true ]]; then
            approved=10a8cac30b21b9885ef320257d7add032c6ef5ac
            for revision in "$sha" "$WORKFLOW_SHA" "$approved"; do
              if [[ ! "$revision" =~ ^[a-f0-9]{40}$ ]]; then
                echo '::error::A full approved source, current workflow and requested PR commit SHA are required.'
                exit 1
              fi
            done
            git -C "$source" fetch -q --no-tags --depth=64 "$origin" \
              refs/heads/main:refs/remotes/origin/main refs/pull/4195/head:refs/remotes/origin/pr-4195
            if [[ "$(git -C "$source" rev-parse refs/remotes/origin/main)" != "$WORKFLOW_SHA" ||
                  "$(git -C "$source" rev-parse refs/remotes/origin/pr-4195)" != "$sha" ]] ||
              ! git -C "$source" merge-base --is-ancestor "$WORKFLOW_SHA" "$sha"; then
              echo '::error::PR or main changed, or the requested commit does not include the current workflow commit.'
              exit 1
            fi
            if ! git -C "$source" cat-file -e "$approved^{commit}" 2>/dev/null; then
              git -C "$source" fetch -q --no-tags --depth=1 "$origin" "$approved"
              test "$(git -C "$source" rev-parse FETCH_HEAD)" = "$approved"
            fi

            # These four paths are supplied by the trusted workflow commit.
            # The rest of the candidate tree must equal the reviewed app commit.
            helper_paths=(
              '.github/workflows/staging-miniapp-pr.yml'
              '.github/workflows/staging-miniapp-native-live.yml'
              'ops/scripts/staging_miniapp_arq_check.py'
              'docs/runbooks/STAGING_VALIDATION.md'
            )
            included=()
            excluded=()
            for path in "${helper_paths[@]}"; do
              git -C "$source" cat-file -e "$WORKFLOW_SHA:$path"
              included+=(":(top,literal)$path")
              excluded+=(":(top,exclude,literal)$path")
            done
            if ! git -C "$source" diff --quiet --no-ext-diff --no-textconv "$approved" "$sha" -- . "${excluded[@]}" ||
              ! git -C "$source" diff --quiet --no-ext-diff --no-textconv "$WORKFLOW_SHA" "$sha" -- "${included[@]}"; then
              echo '::error::PR #4195 tree differs from the reviewed app source or trusted workflow files.'
              exit 1
            fi
            git -C "$source" show "$WORKFLOW_SHA:ops/scripts/staging_miniapp_arq_check.py" > "$d/arq-check.py"
            test -s "$d/arq-check.py"
            printf 'PR #4195 source verification: PASS at `%s` (reviewed app `%s`, current workflow `%s`).\n' \
              "$sha" "$approved" "$WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            git -C "$source" fetch -q --no-tags --depth=1 "$origin" "$sha"
            test "$(git -C "$source" rev-parse FETCH_HEAD)" = "$sha"
          fi
          git -C "$source" checkout -q --detach "$sha"
          test "$(git -C "$source" rev-parse HEAD)" = "$sha"
          if [[ "$RUN_ARQ_ACCEPTANCE" == true ]]; then
