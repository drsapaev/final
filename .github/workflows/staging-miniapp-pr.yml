name: Mini App PR staging preflight

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths: ['.github/workflows/staging-miniapp-pr.yml']
  workflow_dispatch:
    inputs:
      source-sha:
        description: Full reviewed source SHA for PR 4118
        required: true
        type: string

permissions: {}

jobs:
  compose-preflight:
    # Load the reviewed workflow from main, not from the PR source ref.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'drsapaev/final' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REQUESTED_SHA: ${{ inputs.source-sha }}
      REVIEWED_SHA: 33f35996a1f86726b17f8caa819d1ed99aa1729a
    steps:
      - name: Check out the exact approved public source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_SHA" != "$REVIEWED_SHA" ]]; then
            echo "::error::The requested SHA is not the SHA reviewed for this preflight."
            exit 1
          fi
          mkdir -p source
          git -C source init --quiet
          git -C source remote add origin https://github.com/drsapaev/final.git
          git -C source fetch --no-tags --depth=1 origin "$REVIEWED_SHA"
          git -C source checkout --quiet --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$REVIEWED_SHA"

      - name: Verify the isolated backend-only token binding without a real secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT

          cat > "$scratch/synthetic.env" <<'ENV'
          STAGING_PUBLIC_BASE_URL=http://127.0.0.1:18080
          STAGING_PUBLIC_WS_URL=ws://127.0.0.1:18080
          STAGING_PUBLIC_WS_HOST=127.0.0.1:18080
          CORS_ORIGINS=http://127.0.0.1:18080
          POSTGRES_USER=miniapp_synthetic
          POSTGRES_PASSWORD=local-synthetic-password
          POSTGRES_DB=miniapp_synthetic
          SECRET_KEY=local-synthetic-secret-for-config-only
          ADMIN_USERNAME=synthetic
          ADMIN_PASSWORD=local-synthetic-admin
          ADMIN_EMAIL=synthetic@example.invalid
          ADMIN_FULL_NAME=Synthetic Staging
          TELEGRAM_BOT_TOKEN=
          MINIAPP_BACKEND_CREDENTIAL=synthetic-backend-marker-not-a-bot-token
          ENV
          cat > "$scratch/backend-only.yml" <<'YAML'
          services:
            backend:
              environment:
                TELEGRAM_BOT_TOKEN: ${MINIAPP_BACKEND_CREDENTIAL:?missing backend marker}
          YAML

          unset TELEGRAM_BOT_TOKEN MINIAPP_BACKEND_CREDENTIAL
          docker compose --project-name miniapp-pr-preflight \
            --env-file "$scratch/synthetic.env" \
            -f source/ops/compose.staging.yml -f "$scratch/backend-only.yml" \
            config --format json > "$scratch/compose.json"
          python3 - "$scratch/compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as manifest:
              services = json.load(manifest)["services"]

          marker = "synthetic-backend-marker-not-a-bot-token"
          if services["backend"].get("environment", {}).get("TELEGRAM_BOT_TOKEN") != marker:
              sys.exit("Backend does not have the synthetic token binding.")
          for name, service in services.items():
              if name != "backend" and (
                  service.get("environment", {}).get("TELEGRAM_BOT_TOKEN")
                  or marker in json.dumps(service)
              ):
                  sys.exit("Token binding escaped the backend.")
              if any(port.get("host_ip") != "127.0.0.1" for port in service.get("ports", [])):
                  sys.exit("Staging stack publishes a non-loopback port.")

          pending = ["frontend", "backend", "postgres", "redis"]
          selected = set()
          while pending:
              name = pending.pop()
              if name not in selected:
                  selected.add(name)
                  pending.extend(services[name].get("depends_on", {}))
          if "worker" in selected:
              sys.exit("Worker is in the Mini App service dependency chain.")
          print("PASS: synthetic token is backend-only; ports are loopback; worker is not needed.")
          PY
          {
            printf '### Mini App staging preflight\n\n'
            printf 'Source SHA: `%s`\n\n' "$REVIEWED_SHA"
            printf 'Compose wiring: PASS (synthetic marker only)\n\n'
            printf 'Native Telegram acceptance: NOT_RUN. No containers, secrets or tunnel were used.\n'
          } >> "$GITHUB_STEP_SUMMARY"


  static-https-proof:
    # One approved cloud attempt; never runs on manual dispatch or retry.
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'drsapaev/final' &&
      github.event.pull_request.head.repo.full_name == 'drsapaev/final' &&
      github.head_ref == 'ci/miniapp-static-https-proof-20261120' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REVIEWED_SHA: 33f35996a1f86726b17f8caa819d1ed99aa1729a
    steps:
      - name: Build the reviewed static frontend with no credentials or backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          git -C source init --quiet
          git -C source fetch --no-tags --depth=1 https://github.com/drsapaev/final.git "$REVIEWED_SHA"
          git -C source checkout --quiet --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$REVIEWED_SHA"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -e VITE_API_BASE=/api/v1 -e VITE_DISABLE_SPEED_INSIGHTS=1 \
            -e VERCEL_GIT_COMMIT_SHA="$REVIEWED_SHA" \
            -v "$PWD/source/frontend:/build" -w /build docker.io/library/node:20.19.6-slim \
            bash -euc 'npm ci --legacy-peer-deps --include=dev --no-audit --no-fund && npm run build'
          test -f source/frontend/dist/index.html
          grep -Fq "$REVIEWED_SHA" source/frontend/dist/sw.js

      - name: Check static HTTPS isolation and remove the public endpoint
        shell: bash
        run: |
          set -euo pipefail
          cd source
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64 \
            -o cloudflared
          printf '%s  cloudflared\n' 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872 | sha256sum -c -
          chmod 700 cloudflared
          cat > static_origin.py <<'PYTHON_ORIGIN'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from urllib.parse import urlsplit
          import mimetypes
          import re
          import sys

          root = Path(sys.argv[1]).resolve(strict=True)
          release = "33f35996a1f86726b17f8caa819d1ed99aa1729a"
          allow = {"/telegram/mini-app/patient": root / "index.html"}
          for f in (root / "assets").rglob("*"):
              rel = f.relative_to(root).as_posix()
              if (f.is_file() and not f.is_symlink() and f.resolve().is_relative_to(root)
                  and f.suffix.lower() in {".js", ".css", ".woff", ".woff2", ".png", ".svg", ".webp", ".jpeg", ".jpg", ".gif", ".avif"}
                  and re.fullmatch(r"assets/[a-zA-Z0-9_./@-]+", rel)):
                  allow["/" + rel] = f

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *args): pass

              def do_GET(self):
                  if not self.path.startswith("/") or self.path.startswith("//"):
                      self.send_error(404); return
                  path = urlsplit(self.path).path
                  file = allow.get(path)
                  if file is None:
                      self.send_error(404); return
                  data = file.read_bytes()
                  self.send_response(200)
                  self.send_header("Content-Type", mimetypes.guess_type(file)[0] or "application/octet-stream")
                  self.send_header("Content-Length", str(len(data)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("X-Frame-Options", "DENY")
                  self.send_header("Referrer-Policy", "no-referrer")
                  self.send_header("Cross-Origin-Opener-Policy", "same-origin")
                  self.send_header("Cross-Origin-Embedder-Policy", "require-corp")
                  self.send_header("Cross-Origin-Resource-Policy", "same-origin")
                  self.send_header("X-Staging-Source", release)
                  self.send_header("Content-Security-Policy", "default-src 'self'; script-src 'self' https://telegram.org/js/telegram-web-app.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';")
                  self.end_headers()
                  if self.command == "GET":
                      self.wfile.write(data)

              do_HEAD = do_GET

              def do_POST(self):
                  self.send_error(405)

          with ThreadingHTTPServer(("127.0.0.1", 0), Handler) as server:
              print(server.server_port, flush=True)
              server.serve_forever()
          PYTHON_ORIGIN
          set -euo pipefail
          umask 077
          d=$(mktemp -d)
          origin_pid= tunnel_pid=
          cleanup() {
            result=$?
            trap - EXIT
            if [[ -n "$tunnel_pid" ]]; then kill "$tunnel_pid" 2>/dev/null || true; wait "$tunnel_pid" 2>/dev/null || true; fi
            if [[ -n "$origin_pid" ]]; then kill "$origin_pid" 2>/dev/null || true; wait "$origin_pid" 2>/dev/null || true; fi
            rm -rf -- "$d"
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 124' TERM INT
          path=/telegram/mini-app/patient
          mkdir "$d/home"
          python static_origin.py frontend/dist >"$d/origin" 2>"$d/origin.err" &
          origin_pid=$!
          for _ in {1..15}; do [[ ! -s "$d/origin" ]] || break; kill -0 "$origin_pid" || exit 1; sleep 1; done
          port=$(head -1 "$d/origin")
          [[ "$port" =~ ^[0-9]+$ ]]
          local="http://127.0.0.1:$port"
          curl --noproxy '*' -fsS --max-time 6 "$local$path" -o "$d/local.html"
          cmp "$d/local.html" frontend/dist/index.html
          asset=$(python - "$d/local.html" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text()
          print(re.search(r'<script[^>]*\bsrc="(/assets/[^"]+\.js)"',text).group(1))
          PY
          )
          test -f "frontend/dist$asset"
          for banned in / /admin /docs /openapi.json /api/v1/health /api/v1/telegram/mini-app/auth/exchange /sw.js; do
            test "$(curl --noproxy '*' --silent --show-error --max-time 6 -o /dev/null -w '%{http_code}' "$local$banned")" = 404
          done
          test "$(curl --noproxy '*' --silent --show-error --max-time 6 -o /dev/null -w '%{http_code}' -X POST "$local$path")" = 405
          echo 'Static route and denylist verified on loopback; no API or database running.'
          env HOME="$d/home" timeout --kill-after=5s 595s ./cloudflared tunnel --no-autoupdate --protocol http2 --url "$local" >"$d/tunnel.log" 2>&1 &
          tunnel_pid=$!
          url=
          for _ in {1..35}; do
            url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$d/tunnel.log" | grep -Fvx https://api.trycloudflare.com | head -1 || true)
            [[ -z "$url" ]] || break
            kill -0 "$tunnel_pid" 2>/dev/null || break
            sleep 2
          done
          if [[ -z "$url" ]]; then
            echo 'Cloudflare did not issue the temporary HTTPS address.'
            grep -Ei 'err|fail|denied|lookup|timeout|restricted' "$d/tunnel.log" | sed -E 's@[a-z0-9-]+\.trycloudflare\.com@[temporary host]@g' | tail -10 | cut -c1-300 || true
            exit 3
          fi
          printf 'Temporary host acquired.\n'
          live=
          for _ in {1..12}; do
            if curl -fsS --max-time 8 -D "$d/remote.headers" "$url$path" -o "$d/remote.html" 2>"$d/lastcurl" && cmp -s "$d/remote.html" "$d/local.html"; then live=1; break; fi
            kill -0 "$tunnel_pid" 2>/dev/null || break
            sleep 3
          done
          if [[ -z "$live" ]]; then
            echo 'TLS/static response not verified.'
            sed 's/https:\/\/[^ ]*/[temporary URL]/g' "$d/lastcurl" | tail -3
            grep -Ei 'err|fail|denied|lookup|timeout|restricted' "$d/tunnel.log" | sed -E 's@[a-z0-9-]+\.trycloudflare\.com@[temporary host]@g' | tail -8 | cut -c1-260 || true
            exit 4
          fi
          grep -Eiq '^x-staging-source: 33f35996a1f86726b17f8caa819d1ed99aa1729a' "$d/remote.headers"
          grep -Eiq '^content-security-policy:.*https://telegram\.org/js/telegram-web-app\.js' "$d/remote.headers"
          curl -fsS --max-time 10 "$url$asset" -o "$d/remote.js"
          cmp "$d/remote.js" "frontend/dist$asset"
          for banned in / /admin /docs /openapi.json /api/v1/health /api/v1/telegram/mini-app/auth/exchange /sw.js; do
            test "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$url$banned")" = 404
          done
          test "$(curl -sS --max-time 6 -o /dev/null -w '%{http_code}' -X POST "$url$path")" = 405
          echo 'PASS: valid external TLS, exact built Mini App and asset, CSP preserved; API, docs, admin and writes denied.'
          printf 'Static HTTPS proof: PASS for %s. No backend, database, bot or credentials.\n' "$REVIEWED_SHA" >> "$GITHUB_STEP_SUMMARY"
          kill "$tunnel_pid"; wait "$tunnel_pid" || true; tunnel_pid=
          kill "$origin_pid"; wait "$origin_pid" || true; origin_pid=
          test "$(curl --noproxy '*' -s --max-time 3 -o /dev/null -w '%{http_code}' "$local$path" || true)" = 000
          for _ in {1..6}; do
            status=$(curl -s --max-time 6 -o /dev/null -w '%{http_code}' "$url$path" || true)
            if [[ "$status" == 000 || "$status" =~ ^5[0-9]{2}$ ]]; then
              echo "PASS: origin stopped and former public route unavailable (HTTP $status)."
              printf 'Temporary public endpoint cleanup: PASS (HTTP %s).\n' "$status" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo 'Could not verify disappearance of the former public route.'; exit 5
