      (!inputs.native-lab-arq || inputs.native-arq) &&
      (!(inputs.native-live || inputs.native-arq) ||
       (github.workflow_ref == 'drsapaev/final/.github/workflows/staging-miniapp-native-live.yml@refs/heads/main' &&
        !inputs.native-protected &&
