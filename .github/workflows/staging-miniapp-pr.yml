          unset TELEGRAM_BOT_TOKEN
          "$d/compose" exec -T backend sh -ec 'test -n "${TELEGRAM_BOT_TOKEN:-}"'
      - name: Verify Mini App revision and reject out-of-scope requests
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sha=$REVIEWED_SHA
          host=miniapp-staging.finalclinic.fyi
          patient=/telegram/mini-app/patient
          cabinet="$patient?section=cabinet"
          "$d/compose" exec -T postgres psql -XAt --set ON_ERROR_STOP=on \
            -U miniapp_synthetic -d miniapp_synthetic -c 'select count(*) from patients' | grep -Fxq 0
          "$d/compose" exec -T backend python -c "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:18000/', timeout=10))['version'] == '$sha'"
          "$d/compose" exec -T frontend grep -Fq "const BUILD_VERSION = '$sha';" /usr/share/nginx/html/sw.js
          "$d/compose" exec -T frontend find /usr/share/nginx/html/assets -type f > "$d/asset-list"
          python3 - "$d" "$RUN_ARQ_ACCEPTANCE" <<'PY'
          from pathlib import Path
          import re
          import sys

          d = Path(sys.argv[1])
          root = "/usr/share/nginx/html"
          assets = sorted({p.removeprefix(root) for p in (d / "asset-list").read_text().splitlines()})
          assert 0 < len(assets) <= 1000
          assert all(re.fullmatch(r"/assets/[A-Za-z0-9._-]+", p) for p in assets)
          prefix = "/api/v1/telegram/mini-app/"
          exact_api = ("auth/exchange", "auth/refresh", "auth/logout", "sessions/list",
                       "sessions/revoke-all", "patient/manifest", "cabinet/summary")
          if sys.argv[2] == "true":
              exact_api = ("auth/exchange", "patient/manifest", "cabinet/summary", "onboarding/requests")
          routes = [
              '    "GET:/telegram/mini-app/patient" static;',
              '    "GET:/telegram/mini-app/patient?section=cabinet" static;',
              '    "GET:/favicon.svg" static;',
              '    "GET:/api/v1/auth/csrf-token" api;',
              *[f'    "GET:{path}" static;' for path in assets],
              *[f'    "POST:{prefix}{path}" api;' for path in exact_api],
          ]
          if sys.argv[2] == "true":
              routes.append('    "GET:/telegram/mini-app/patient?section=appointments" static;')
          else:
              routes.append('    ~^POST:/api/v1/telegram/mini-app/sessions/[a-f0-9-][a-f0-9-]*/revoke$ api;')
          conf = r"""
          map_hash_bucket_size 256;
          map_hash_max_size 4096;
          map "$request_method:$request_uri" $destination {
              default denied;
          ROUTES
          }
          map $destination $upstream_name {
              default "";
              static frontend:80;
              api backend:18000;
          }
          server {
              listen 80 default_server;
              server_name miniapp-staging.finalclinic.fyi;
              access_log off;
              error_log /dev/null;
              client_max_body_size 32k;
              resolver 127.0.0.11 ipv6=off;
              if ($http_host != miniapp-staging.finalclinic.fyi) { return 404; }
              if ($destination = denied) { return 404; }
              location / {
                  proxy_pass http://$upstream_name$request_uri;
                  proxy_set_header Host miniapp-staging.finalclinic.fyi;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-Host miniapp-staging.finalclinic.fyi;
                  proxy_set_header X-Forwarded-For "";
                  proxy_set_header Upgrade "";
                  proxy_set_header Connection close;
                  proxy_hide_header Cache-Control;
                  add_header Cache-Control "no-store, private" always;
              }
          }
          """
          (d / "ingress.conf").write_text(conf.replace("ROUTES", "\n".join(routes)))
          PY
          "$d/compose" up -d --no-deps --no-build --pull never gateway
          ready=false
          status=000
          for _ in {1..30}; do
            status="$(curl -sS --max-time 3 -H "Host: $host" -D "$d/headers" -o "$d/page" -w '%{http_code}' "http://127.0.0.1:18086$cabinet" 2>/dev/null || true)"
            if [[ "$status" == 200 ]]; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Loopback Cabinet did not become ready (HTTP $status)."
            "$d/compose" logs --no-color --tail 15 gateway || true
            exit 1
          fi
          grep -iE '^content-security-policy:.*https://telegram\.org/js/telegram-web-app\.js' "$d/headers" >/dev/null
          grep -iE '^cache-control:.*no-store' "$d/headers" >/dev/null
          grep -qiE '^cross-origin-embedder-policy: require-corp' "$d/headers"
          script_path="$(sed -nE 's@.*src="(/assets/[A-Za-z0-9._-]+\.js)".*@\1@p' "$d/page" | head -n1)"
          test -n "$script_path"
          curl -fsS --max-time 10 -H "Host: $host" "http://127.0.0.1:18086$script_path" -o "$d/bundle.js"
          expected_hash="$("$d/compose" exec -T frontend sha256sum "/usr/share/nginx/html$script_path" | cut -d' ' -f1)"
          test "$(sha256sum "$d/bundle.js" | cut -d' ' -f1)" = "$expected_hash"
          for denied in / /docs /openapi.json /api/v1/auth/me /api/v1/patients /sw.js /assets/not-built.js "$patient?not=allowed"; do
            test "$(curl -sS --max-time 5 -H "Host: $host" -o /dev/null -w '%{http_code}' "http://127.0.0.1:18086$denied")" = 404
          done
          test "$(curl -sS --max-time 5 -H 'Host: unrelated.invalid' -o /dev/null -w '%{http_code}' "http://127.0.0.1:18086$patient")" = 404
          test "$(curl -sS --max-time 5 -H "Host: $host" -X POST -o /dev/null -w '%{http_code}' "http://127.0.0.1:18086$patient")" = 404
          status="$(curl -sS --max-time 5 -H "Host: $host" -H 'Content-Type: application/json' --data '{}' -o "$d/csrf.json" -w '%{http_code}' "http://127.0.0.1:18086/api/v1/telegram/mini-app/auth/exchange")"
          test "$status" = 403
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["reason"] == "missing_cookie"' "$d/csrf.json"
          curl -fsS --max-time 5 -H "Host: $host" "http://127.0.0.1:18086/api/v1/auth/csrf-token" -o "$d/bootstrap.json"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["csrf_token"]' "$d/bootstrap.json"
          test "$("$d/compose" ps --services --status running | sort)" = $'backend\nfrontend\ngateway\npostgres\nredis'
          printf 'Loopback Mini App ingress and CSRF: PASS at `%s`. This step checks loopback only.\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Seed one approved synthetic Mini App identity
        if: inputs.native-live || inputs.native-arq
        shell: bash
        env:
          STAGING_TELEGRAM_CHAT_ID: ${{ secrets.STAGING_TELEGRAM_CHAT_ID }}
          STAGING_TELEGRAM_BOT_TOKEN: ${{ inputs.native-arq && secrets.STAGING_TELEGRAM_BOT_TOKEN || '' }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "$STAGING_TELEGRAM_CHAT_ID" =~ ^[1-9][0-9]{0,15}$ ]]; then
            echo '::error::A verified private STAGING_TELEGRAM_CHAT_ID is required in staging-integrations.'
            exit 1
          fi
          if [[ "$RUN_ARQ_ACCEPTANCE" == true ]]; then
            python3 - <<'PY'
          import http.client
          import json
          import os
          from urllib.parse import urlencode

          try:
              token = os.environ["STAGING_TELEGRAM_BOT_TOKEN"]
              chat_id = int(os.environ["STAGING_TELEGRAM_CHAT_ID"])
              assert token and 0 < chat_id < 2**52
              for method, data in (("getMe", {}), ("getChat", {"chat_id": chat_id})):
                  conn = http.client.HTTPSConnection("api.telegram.org", timeout=8)
                  try:
                      conn.request("POST", f"/bot{token}/{method}", urlencode(data),
                                   {"Content-Type": "application/x-www-form-urlencoded"})
                      response = conn.getresponse()
                      assert response.status == 200
                      payload = json.loads(response.read(65536))
                      assert payload["ok"] is True
                      result = payload["result"]
                      if method == "getMe":
                          assert result["is_bot"] is True and result["username"].lower() == "kosmed_staging_bot"
                      else:
                          assert result["type"] == "private" and result["id"] == chat_id
                  finally:
                      conn.close()
          except Exception:
              raise SystemExit("Protected staging bot or approved private chat verification failed.") from None
          print("PASS: verified staging bot and private test chat; no message sent.")
          PY
            unset STAGING_TELEGRAM_BOT_TOKEN
            if ! printf '%s\n' "$STAGING_TELEGRAM_CHAT_ID" | "$d/compose" exec -T backend \
              python -c "$(cat "$d/arq-check.py")" seed "$REVIEWED_SHA" >/dev/null 2>&1; then
              echo '::error::The reviewed synthetic reminder fixture could not be seeded.'
              exit 1
            fi
            exit 0
          fi
          seed=$(cat <<'PY'
          import os
          import sys

          from sqlalchemy import func, select, text

          from app.db.session import SessionLocal
          from app.models.patient import Patient
          from app.models.telegram_config import TelegramUser

          chat_id = int(sys.stdin.readline())
          assert 0 < chat_id < 2**52
          assert os.environ.get("ENV") == "staging"
          with SessionLocal() as db:
              assert db.get_bind().url.host == "postgres"
              assert db.execute(text("select current_database(), current_user")).one() == (
                  "miniapp_synthetic", "miniapp_synthetic",
              )
              for model in (Patient, TelegramUser):
                  assert db.scalar(select(func.count()).select_from(model)) == 0
              patient = Patient(first_name="SYNTHETIC", last_name="MINIAPP-STAGING")
              db.add(patient)
              db.flush()
              db.add(TelegramUser(
                  patient_id=patient.id,
                  chat_id=chat_id,
                  active=True,
                  blocked=False,
                  notifications_enabled=False,
                  appointment_reminders=False,
                  lab_notifications=False,
              ))
              db.commit()
          PY
          )
          if ! printf '%s\n' "$STAGING_TELEGRAM_CHAT_ID" | "$d/compose" exec -T backend \
              python -c "$seed" >/dev/null 2>&1; then
            echo '::error::Synthetic identity could not be seeded in the isolated database.'
            exit 1
          fi

      - name: Expose only the verified Mini App gateway and await session evidence
        if: inputs.native-live || inputs.native-arq
        shell: bash
        env:
          TUNNEL_TOKEN: ${{ secrets.STAGING_MINIAPP_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          host=miniapp-staging.finalclinic.fyi
          origin="https://$host"
          patient=/telegram/mini-app/patient
          test -n "${TUNNEL_TOKEN:-}" || {
            echo '::error::Dedicated STAGING_MINIAPP_TUNNEL_TOKEN is required in staging-integrations.'
            exit 1
          }
          token=$TUNNEL_TOKEN
          unset TUNNEL_TOKEN

          http_status() {
            curl --noproxy '*' --silent --max-time 5 --proto '=https' \
              --output /dev/null --write-out '%{http_code}' "$origin$1" || true
          }
          offline() {
            [[ "$(http_status "$patient")" =~ ^(404|502|503|525|530)$ ]]
          }
          offline || { echo '::error::Staging hostname is already serving the Mini App.'; exit 1; }
          curl --fail --silent --show-error --location --max-time 40 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64 \
            --output "$d/cloudflared"
          (cd "$d"; printf '%s  cloudflared\n' 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872 | sha256sum --check -)
          chmod 700 "$d/cloudflared"

          connector=
          cleanup_connector() {
            local result=$? stopped=false
            trap - EXIT
            if [[ -n "$connector" ]]; then
              kill -TERM "$connector" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 "$connector" 2>/dev/null || break
                sleep 0.2
              done
              if kill -0 "$connector" 2>/dev/null; then kill -KILL "$connector" || result=1; fi
              wait "$connector" 2>/dev/null || true
              for _ in {1..8}; do
                if offline; then stopped=true; break; fi
                sleep 1
              done
              printf 'Public ingress stopped: %s.\n' "$stopped" >> "$GITHUB_STEP_SUMMARY"
              [[ "$stopped" == true ]] || result=1
            fi
            exit "$result"
          }
          trap cleanup_connector EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          TUNNEL_TOKEN="$token" "$d/cloudflared" tunnel --no-autoupdate --protocol http2 \
            --metrics 127.0.0.1:20246 run >/dev/null 2>&1 &
          connector=$!
          unset token

          ready=false
          for _ in {1..30}; do
            kill -0 "$connector" 2>/dev/null || exit 1
            if curl --noproxy '*' --fail --silent --max-time 4 --proto '=https' \
                "$origin$patient?section=cabinet" -D "$d/public.headers" -o "$d/public.html" &&
                cmp -s "$d/page" "$d/public.html"; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || { echo '::error::Public HTTPS did not return the verified Mini App build.'; exit 1; }
          for denied in / /docs /openapi.json /api/v1/patients /api/v1/auth/me /sw.js /assets/not-built.js; do
            test "$(http_status "$denied")" = 404
          done
          test "$(http_status /api/v1/auth/csrf-token)" = 200
          grep -iE '^content-security-policy:.*https://telegram\.org/js/telegram-web-app\.js' "$d/public.headers" >/dev/null
          grep -qiE '^cross-origin-embedder-policy: require-corp' "$d/public.headers"
          grep -qiE '^cache-control:.*no-store' "$d/public.headers"
          if [[ "$RUN_ARQ_ACCEPTANCE" == true ]]; then
            for staff_route in /api/v1/telegram/onboarding/requests /api/v1/telegram/onboarding/requests/1/link-existing; do
              test "$(http_status "$staff_route")" = 404
              test "$(curl --noproxy '*' --silent --max-time 5 --proto '=https' -X POST --output /dev/null --write-out '%{http_code}' "$origin$staff_route")" = 404
            done
            printf '### Native onboarding ready\n\nOpen the approved staging bot Mini App in Telegram. In Appointments submit the synthetic contact SYNTHETIC staging with phone +998000000000, tomorrow’s date and the default 09:30 time. Return to Cabinet after the request is linked. Window: 25 minutes.\n' >> "$GITHUB_STEP_SUMMARY"
            printf 'Native onboarding ready. Operator instructions are in the run summary.\n'
            deadline=$((SECONDS + 1500))
            for check in link ready; do
              while :; do
                kill -0 "$connector" 2>/dev/null || exit 1
                if "$d/compose" exec -T backend python -c "$(cat "$d/arq-check.py")" "$check" "$REVIEWED_SHA" >/dev/null 2>&1; then
                  break
                else
                  result=$?
                fi
                if [[ "$result" != 3 ]] || (( SECONDS >= deadline )); then
                  echo "::error::Native onboarding phase '$check' did not pass."
                  exit 1
                fi
                sleep 5
              done
            done
            printf 'Native signed onboarding, canonical linkage and cabinet access: PASS on `%s`.\n' "$REVIEWED_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'Staging ready at https://%s%s?section=cabinet. Open the verified staging-bot Mini App under the same allowed Telegram account on both devices. Open the session list on A, wait 15 minutes after login without closing A, then refresh the session list on A, revoke B, verify B loses access, and log out on A. The window is 25 minutes.\n' "$host" "$patient"

          # Only a boolean leaves the database, with no patient, session or request data.
          query=$(cat <<'SQL'
          SELECT EXISTS (
            SELECT 1 FROM patient_access_audit_logs login
            JOIN patient_access_audit_logs refresh ON refresh.session_id = login.session_id
            JOIN patient_access_audit_logs revoke ON revoke.session_id = login.session_id
            JOIN patient_access_audit_logs logout ON logout.session_id = login.session_id
            JOIN patient_access_audit_logs second
              ON second.subject_patient_id = login.subject_patient_id
              AND second.session_id <> login.session_id
            JOIN telegram_mini_app_sessions victim ON victim.id::text = second.session_id
            WHERE login.resource_type = 'session_management' AND login.action = 'login'
              AND login.outcome = 'success'
              AND second.resource_type = 'session_management' AND second.action = 'login'
              AND second.outcome = 'success' AND second.timestamp < revoke.timestamp
              AND refresh.resource_type = 'session_management' AND refresh.action = 'refresh'
              AND refresh.outcome = 'success'
              AND refresh.timestamp >= login.timestamp + interval '15 minutes'
              AND revoke.resource_type = 'session_management' AND revoke.action = 'revoke'
              AND revoke.outcome = 'success' AND revoke.extra_data->>'revoked_count' = '1'
              AND revoke.timestamp >= refresh.timestamp
              AND (SELECT count(*) FROM telegram_mini_app_sessions sessions
                   WHERE sessions.patient_id = login.subject_patient_id) = 2
              AND victim.patient_id = login.subject_patient_id
              AND victim.revoked_at BETWEEN refresh.timestamp AND revoke.timestamp
              AND logout.resource_type = 'session_management' AND logout.action = 'logout'
              AND logout.outcome = 'success' AND logout.extra_data->>'revoked_count' = '1'
              AND logout.timestamp > revoke.timestamp
          );
          SQL
          )
          deadline=$((SECONDS + 1500))
          while (( SECONDS < deadline )); do
            kill -0 "$connector" 2>/dev/null || exit 1
            evidence="$(timeout 10s "$d/compose" exec -T postgres psql -XAt \
              --set ON_ERROR_STOP=on -U miniapp_synthetic -d miniapp_synthetic -c "$query" 2>/dev/null)"
            if [[ "$evidence" == t ]]; then
              printf 'Session audit PASS for 33f35996: two logins, refresh after 15 minutes, one other session revoked, current session logged out. Operator confirmation of the Telegram UI is recorded separately.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          printf 'Native acceptance incomplete. Expected session evidence was missing at timeout.\n' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Process one versioned visit reminder through ARQ and Telegram
        if: env.RUN_ARQ_ACCEPTANCE == 'true'
        shell: bash
        env:
          ARQ_STAGING_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          project="miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -n "$ARQ_STAGING_BOT_TOKEN"
          token=$ARQ_STAGING_BOT_TOKEN
          unset ARQ_STAGING_BOT_TOKEN

          # The preceding step verified the public connector shut down. Stop
          # the local ingress too before granting the isolated worker egress.
          "$d/compose" stop gateway >/dev/null
          test "$("$d/compose" ps --services --status running | sort)" = $'backend\nfrontend\npostgres\nredis'
          test "$(docker image inspect --format '{{.Id}}' "$project-backend")" = \
            "$(docker inspect --format '{{.Image}}' "$("$d/compose" ps -q backend)")"
          upstream=$(getent ahostsv4 api.telegram.org | awk '$2 == "STREAM" && !seen++ {print $1}')
          python3 -c 'import ipaddress, sys; assert ipaddress.IPv4Address(sys.argv[1]).is_global' "$upstream"

          cat > "$d/telegram-relay.py" <<'PY'
          import selectors
          import socket
          import socketserver
          import sys

          bind, upstream = sys.argv[1:]

          class Relay(socketserver.BaseRequestHandler):
              def handle(self):
                  try:
                      with socket.create_connection((upstream, 443), timeout=8) as telegram, selectors.DefaultSelector() as watch:
                          self.request.settimeout(10)
                          watch.register(self.request, selectors.EVENT_READ, telegram)
                          watch.register(telegram, selectors.EVENT_READ, self.request)
                          while events := watch.select(timeout=12):
                              for key, _ in events:
                                  chunk = key.fileobj.recv(65536)
                                  if not chunk:
                                      return
                                  key.data.sendall(chunk)
                  except OSError:
                      return

          with socketserver.ThreadingTCPServer((bind, 443), Relay) as server:
              server.daemon_threads = True
              server.serve_forever()
          PY
          chmod 444 "$d/telegram-relay.py"
          cat > "$d/arq.yml" <<YAML
          services:
            worker:
              image: $project-backend
              build: !reset null
              cap_drop: [ALL]
              volumes: !reset []
              dns: [127.0.0.1]
              networks: [default, reminder]
              extra_hosts:
                api.telegram.org: 172.30.242.2
              environment:
                TELEGRAM_BOT_TOKEN: \${ARQ_STAGING_BOT_TOKEN:-}
            telegram-relay:
              image: $project-backend
              entrypoint: [python, /relay.py, 172.30.242.2, "$upstream"]
              user: "65534:65534"
              volumes:
                - $d/telegram-relay.py:/relay.py:ro
              cap_drop: [ALL]
              sysctls:
                net.ipv4.ip_unprivileged_port_start: 443
              networks:
                reminder:
                  ipv4_address: 172.30.242.2
                ingress: {}
          networks:
            reminder:
              internal: true
              ipam:
                config:
                  - subnet: 172.30.242.0/28
          YAML
          ARQ_STAGING_BOT_TOKEN=arq-synthetic-marker "$d/compose" -f "$d/arq.yml" config --format json | python3 -c '
          import json, sys
          c = json.load(sys.stdin)
          s = c["services"]
          worker, relay = s["worker"], s["telegram-relay"]
          assert not any(n.get("external") for n in c["networks"].values())
          assert all(c["networks"][n]["internal"] is True for n in ("default", "reminder"))
          assert set(worker["networks"]) == {"default", "reminder"}
          assert set(relay["networks"]) == {"reminder", "ingress"}
          assert all(not s[n].get("ports") and not s[n].get("privileged") for n in ("worker", "telegram-relay"))
          assert not worker.get("build") and not worker.get("volumes") and worker["dns"] == ["127.0.0.1"]
          assert relay["volumes"][0]["read_only"] is True
          assert worker["environment"]["TELEGRAM_BOT_TOKEN"] == "arq-synthetic-marker"
          assert all("arq-synthetic-marker" not in json.dumps(v) for k, v in s.items() if k != "worker")
          '

          "$d/compose" -f "$d/arq.yml" up -d --no-deps --no-build --pull never telegram-relay
          run_worker=("$d/compose" -f "$d/arq.yml" run --rm --no-deps --pull never -T --entrypoint python worker)
          "${run_worker[@]}" -c '
          import os, socket, ssl, time
          assert not os.environ.get("TELEGRAM_BOT_TOKEN")
          assert socket.gethostbyname("api.telegram.org") == "172.30.242.2"
          for attempt in range(8):
              try:
                  with socket.create_connection(("api.telegram.org", 443), timeout=5) as tcp:
                      with ssl.create_default_context().wrap_socket(tcp, server_hostname="api.telegram.org"):
                          break
              except OSError:
                  if attempt == 7:
                      raise
                  time.sleep(1)
          '

          helper=$(cat "$d/arq-check.py")
          if ! "$d/compose" exec -T backend python -c "$helper" enqueue "$REVIEWED_SHA" >/dev/null 2>&1; then
            echo '::error::Could not enqueue the single versioned synthetic reminder.'
            exit 1
          fi
          if ! ARQ_STAGING_BOT_TOKEN="$token" "${run_worker[@]}" -c "$helper" worker "$REVIEWED_SHA" >/dev/null 2>&1; then
            echo '::error::ARQ worker failed or delivery is uncertain; investigate before another attempt.'
            exit 1
          fi
          unset token
          if ! "$d/compose" exec -T backend python -c "$helper" verify "$REVIEWED_SHA" >/dev/null 2>&1; then
            echo '::error::ARQ result or PostgreSQL delivery stamp is missing; investigate before retrying.'
            exit 1
          fi
          printf 'ARQ schedule-versioned Telegram reminder and PostgreSQL delivery stamp: PASS on `%s`. Confirm the single synthetic reminder in the approved test chat.\n' "$REVIEWED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove exactly this isolated stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          project="miniapp-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result=PASS
          if [[ -x "$d/compose" ]]; then
            overrides=()
            if [[ -f "$d/arq.yml" ]]; then overrides=(-f "$d/arq.yml"); fi
            "$d/compose" "${overrides[@]}" down --volumes --remove-orphans --rmi local || result=FAIL
          fi
          # The frontend has an explicit project-owned tag; Compose can keep it.
          if docker image inspect "$project-frontend" >/dev/null 2>&1; then
            docker image rm "$project-frontend" || result=FAIL
          fi
          for type in container network volume image; do
            opts=(-q)
            if [[ "$type" == container || "$type" == image ]]; then opts+=(-a); fi
            if ! remaining="$(docker "$type" ls "${opts[@]}" --filter "label=com.docker.compose.project=$project")" || [[ -n "$remaining" ]]; then
              result=FAIL
            fi
          done
          if docker image inspect "$project-backend" >/dev/null 2>&1; then result=FAIL; fi
          rm -rf -- "$d" || result=FAIL
          printf 'Isolated Mini App teardown: %s.\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          test "$result" = PASS
