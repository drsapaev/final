name: Queue completion and call browser proof

on:
  push:
    branches:
      - codex/verify-call-flow-4274

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: synthetic_worklist
          POSTGRES_USER: worklist_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U worklist_ci -d synthetic_worklist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.18'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact project dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm --prefix frontend ci --legacy-peer-deps
          cd frontend
          npx playwright install chromium --only-shell
      - name: Check manual and completion calls in Chromium
        env:
          DATABASE_URL: postgresql+psycopg://worklist_ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/synthetic_worklist
          APIPORT: '18085'
          WEBPORT: '18086'
          TESTING: '1'
          ENV: dev
          TZ: UTC
          VITE_API_BASE_URL: same-origin
          VITE_PROXY_TARGET: http://127.0.0.1:18085
        run: |
          set -euo pipefail
          export WORKLIST_PROOF_DIR="$(mktemp -d)"
          export WORKLIST_PROOF_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(28))')"
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf '%s\n' '2026-11-25T18:59:00+00:00' > "$WORKLIST_PROOF_DIR/instant"
          cleanup() {
            for pid in "${api_pid:-}" "${vite_pid:-}"; do
              if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; fi
            done
            rm -rf "$WORKLIST_PROOF_DIR"
          }
          trap cleanup EXIT
          (
            cd backend
            export PYTHONPATH="$PWD:$PWD/tests/e2e_support"
            python tests/e2e_support/call_flow_fixture.py
            exec python -m uvicorn call_flow_fixture:app --host 127.0.0.1 --port "$APIPORT"
          ) >"$WORKLIST_PROOF_DIR/api.log" 2>&1 &
          api_pid=$!
          (cd frontend; exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port "$WEBPORT" --strictPort) >"$WORKLIST_PROOF_DIR/vite.log" 2>&1 &
          vite_pid=$!
          if ! curl -fsS --retry 45 --retry-connrefused --retry-delay 1 --max-time 10 http://127.0.0.1:18085/api/v1/health >/dev/null; then
            tail -50 "$WORKLIST_PROOF_DIR/api.log"
            exit 1
          fi
          if ! curl -fsS --retry 45 --retry-connrefused --retry-delay 1 --max-time 10 http://127.0.0.1:18086/e2e/call-flow-proof/ >/dev/null; then
            tail -50 "$WORKLIST_PROOF_DIR/vite.log"
            exit 1
          fi
          node frontend/e2e/call-flow-proof/browser.cjs
