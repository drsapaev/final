name: 🛡️ AI Safety Guardrails

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/app/api/v1/endpoints/ai_gateway.py'
      - 'backend/app/api/v1/endpoints/emr_ai_enhanced.py'
      - 'backend/app/api/v1/endpoints/ai_chat.py'
      - 'backend/app/api/v1/endpoints/phrase_suggest.py'
      - 'backend/app/services/ai_feature_gating.py'
      - 'backend/app/services/feature_flags.py'
      - 'frontend/e2e/ai-safety-guardrails.spec.ts'
      - 'frontend/e2e/ai-safety-guardrails.spec.js'
      - '.github/workflows/ai-safety-guardrails.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/api/v1/endpoints/ai_gateway.py'
      - 'backend/app/api/v1/endpoints/emr_ai_enhanced.py'
      - 'backend/app/api/v1/endpoints/ai_chat.py'
      - 'backend/app/api/v1/endpoints/phrase_suggest.py'
      - 'backend/app/services/ai_feature_gating.py'
      - 'backend/app/services/feature_flags.py'
      - 'frontend/e2e/ai-safety-guardrails.spec.ts'
      - 'frontend/e2e/ai-safety-guardrails.spec.js'
  schedule:
    # Nightly 02:30 UTC — catch regressions from unrelated refactors
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-safety-contract-test:
    name: 🛡️ AI safety contract regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinicdb
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinicdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic_ci_only_password@localhost:5432/clinicdb
      PYTHONPATH: ${{ github.workspace }}/backend
      # Use mock AI provider (no real API calls)
      AI_PROVIDER_MOCK: '1'
      # PR-8: disable rate limiting in CI — Playwright spec makes 6+ login
      # attempts (doctor + admin + registrar across 4 tests) which exceeds
      # the 5/minute login rate limit.
      TESTING: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.10'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Seed AI feature flags
        run: |
          cd backend
          python -m app.scripts.seed_ai_feature_flags

      - name: Seed minimal test users (admin + doctor + registrar)
        run: |
          cd backend
          python -c "
          import os
          from sqlalchemy import create_engine, text
          from passlib.context import CryptContext

          # PR-8: generate argon2 hash in runtime instead of hardcoding a
          # malformed one. The previous hash was truncated/invalid, causing
          # login to fail with 'malformed argon2 hash' on verify.
          pwd_context = CryptContext(schemes=['argon2', 'bcrypt'], deprecated='auto')
          DOCTOR_HASH = pwd_context.hash('QA_PASSWORD_123')
          ADMIN_HASH = DOCTOR_HASH  # same password for CI
          REGISTRAR_HASH = DOCTOR_HASH

          # Debug: verify hash works before seeding
          print('Hash verify check:', pwd_context.verify('QA_PASSWORD_123', DOCTOR_HASH))
          print('Hash length:', len(DOCTOR_HASH))

          e = create_engine(os.environ['DATABASE_URL'])
          with e.begin() as c:
            for username, email, role, pw_hash in [
              ('qa_doctor@clinic.com',    'qa_doctor@clinic.com',    'Doctor',    DOCTOR_HASH),
              ('qa_admin@clinic.com',     'qa_admin@clinic.com',     'Admin',     ADMIN_HASH),
              ('qa_registrar@clinic.com', 'qa_registrar@clinic.com', 'Registrar', REGISTRAR_HASH),
            ]:
              c.execute(text('''
                INSERT INTO users (username, email, role, hashed_password, is_active, is_superuser, must_change_password, push_notifications_enabled, created_at)
                VALUES (:u, :e, :r, :p, true, false, false, false, NOW())
                ON CONFLICT (username) DO UPDATE SET
                  hashed_password = EXCLUDED.hashed_password,
                  is_active = true,
                  role = EXCLUDED.role,
                  must_change_password = false
              '''), {'u': username, 'e': email, 'r': role, 'p': pw_hash})

            # Admin is a critical 2FA role: pre-enroll verified TOTP with a
            # fixed CI-only secret so the spec can complete the challenge.
            # 2FA enforcement is unconditional (no bypass flag exists).
            # backup_codes_generated/backup_codes_count are NOT NULL without
            # server defaults (ORM-level defaults only) — set them explicitly.
            c.execute(text('''
              INSERT INTO two_factor_auth
                (user_id, totp_secret, totp_enabled, totp_verified,
                 backup_codes_generated, backup_codes_count, recovery_enabled)
              VALUES ((SELECT id FROM users WHERE username = 'qa_admin@clinic.com'),
                      :secret, true, true, false, 0, false)
              ON CONFLICT (user_id) DO UPDATE SET
                totp_secret = EXCLUDED.totp_secret,
                totp_enabled = true,
                totp_verified = true
            '''), {'secret': os.environ['QA_ADMIN_TOTP_SECRET']})
            print('Test users + admin TOTP enrolled.')
          "
        env:
          QA_ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP

      - name: Start backend
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 18000 > server.log 2>&1 &
          echo $! > server.pid

          # Wait for startup
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:18000/api/v1/health >/dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat server.log
          exit 1

      - name: Install frontend deps + Playwright
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Run AI safety guardrails spec
        env:
          BACKEND_URL: http://127.0.0.1:18000
          QA_DOCTOR_USERNAME: qa_doctor@clinic.com
          QA_DOCTOR_PASSWORD: QA_PASSWORD_123
          QA_ADMIN_USERNAME: qa_admin@clinic.com
          QA_ADMIN_PASSWORD: QA_PASSWORD_123
          QA_REGISTRAR_USERNAME: qa_registrar@clinic.com
          QA_REGISTRAR_PASSWORD: QA_PASSWORD_123
          # Same CI-only secret the seed step enrolled for qa_admin.
          QA_ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        run: |
          cd frontend
          # Spec migrated .spec.js -> .spec.ts in PR #2433 (TS migration).
          # Resolve whichever exists; fail loudly if neither.
          if [ -f e2e/ai-safety-guardrails.spec.ts ]; then
            SPEC=e2e/ai-safety-guardrails.spec.ts
          elif [ -f e2e/ai-safety-guardrails.spec.js ]; then
            SPEC=e2e/ai-safety-guardrails.spec.js
          else
            echo "ERROR: ai-safety-guardrails.spec.{ts,js} not found" >&2
            exit 1
          fi
          npx playwright test "$SPEC" --project=chromium --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-safety-playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Stop backend
        if: always()
        run: |
          cd backend
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
            rm server.pid
          fi

  # Canonical R1 notifier (the previous inline issues.create failed silently
  # with 403: workflow grants only contents:read; issue creation needs
  # issues:write — granted job-scoped here).
  notify-failure:
    name: 🔔 Notify on failure
    runs-on: ubuntu-latest
    needs: [ai-safety-contract-test]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create failure issue
        uses: ./.github/actions/notify-failure
        with:
          title: 🛡️ AI Safety guardrails regression detected
          detail: |
            Nightly AI safety guardrail test failed. This means an AI endpoint either:
            - Stopped including the `ai_safety_meta` block in responses
            - Stopped enforcing role-based access (registrar got 200 instead of 403)
            - Stopped returning 503 when its feature flag is disabled

            Any of these is a **patient safety regression** — AI output might get
            auto-saved to medical records without doctor confirmation.
            Fix BEFORE the next patient is seen. Download the playwright-report
            artifact from the run to identify the failed assertion.
