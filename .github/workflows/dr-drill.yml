name: 🔄 DR Drill (Backup Restore Test)

on:
  schedule:
    # Weekly Sunday 04:00 UTC — between security-scan (03:00) and gitleaks (03:30)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      backup_file:
        description: 'Optional: explicit backup file path (default: latest in backups/)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dr-drill
  cancel-in-progress: false

jobs:
  dr-drill:
    name: 🔄 Verify backup restores
    runs-on: ubuntu-latest
    # Only run on the main repo, not forks — forks don't have staging DB access.
    if: github.repository == 'drsapaev/final'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinicdb
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinicdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic_ci_only_password@localhost:5432/clinicdb
      DRILL_DB_NAME: clinic_dr_drill
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.10'

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-monitoring.txt

      - name: Run Alembic migrations (populate clinicdb with schema)
        run: |
          cd backend
          alembic upgrade head

      - name: Seed demo data (so the backup has rows and an admin)
        run: |
          cd backend
          # The old step only COUNTED tables (synthetic_seed refuses
          # prod-looking names) — the dump was schema-only and the drill's
          # admin-RBAC check could never pass. dev_seed is designed for
          # exactly this (proven in load.yml).
          DEV_DEMO_PASSCODE=dr-drill-demo-passcode \
            python -m app.scripts.dev_seed --confirm-dev-seed

      - name: Create a backup (pg_dump)
        run: |
          mkdir -p backend/backups
          cd backend
          PGPASSWORD=clinic_ci_only_password pg_dump \
            -h localhost -p 5432 -U clinic -d clinicdb \
            -F c -f backups/backup_ci_test.dump
          ls -lh backups/

      - name: Run DR drill
        env:
          BACKUP_FILE: ${{ github.event.inputs.backup_file || '' }}
        run: |
          cd backend
          # The drill will:
          # 1. Find latest backup in backups/
          # 2. Create clinic_dr_drill DB
          # 3. pg_restore into it
          # 4. Smoke test users/appointments/services/audit_log tables
          # 5. Drop clinic_dr_drill
          if [ -n "$BACKUP_FILE" ]; then
            BACKUP_FILE="$BACKUP_FILE" python -m app.scripts.dr_drill
          else
            python -m app.scripts.dr_drill
          fi

  # Canonical R1 notifier (the previous inline issues.create failed silently
  # with 403: workflow grants only contents:read; issue creation needs
  # issues:write — granted job-scoped here). DR failures alert on any event:
  # a broken restore is a P0 regardless of how the drill was triggered.
  notify-failure:
    name: 🔔 Notify on failure
    runs-on: ubuntu-latest
    needs: [dr-drill]
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create failure issue
        uses: ./.github/actions/notify-failure
        with:
          title: 🔴 DR Drill failed — backup does NOT restore cleanly
          detail: |
            The latest backup cannot be restored to a working state.
            For a medical system this is a P0 incident — if prod burns tonight, you cannot recover.
            Identify whether the failure is in pg_dump, pg_restore, or the smoke test:
            - pg_restore failing → backup format problem (check pg_dump version compatibility)
            - smoke test failing → schema drift; run `alembic upgrade head` against the restored backup
            Do NOT close this issue until the DR drill passes again.
