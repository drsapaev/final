name: 🔄 DR Drill (Backup Restore Test)

on:
  schedule:
    # Weekly Sunday 04:00 UTC — between security-scan (03:00) and gitleaks (03:30)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      backup_file:
        description: 'Optional: explicit backup file path (default: latest in backups/)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dr-drill
  cancel-in-progress: false

jobs:
  dr-drill:
    name: 🔄 Verify backup restores
    # Pin the runner and Python pairing verified by security-scan and AI Safety.
    runs-on: ubuntu-24.04
    # Run only in the canonical repository; the database is a job-local service.
    if: github.repository == 'drsapaev/final'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinicdb
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinicdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic_ci_only_password@localhost:5432/clinicdb
      DRILL_DB_NAME: clinic_dr_drill
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.18'

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-monitoring.txt

      - name: Run Alembic migrations (populate clinicdb with schema)
        run: |
          cd backend
          alembic upgrade head

      - name: Seed demo data (so the backup has rows and an admin)
        run: |
          cd backend
          # The old step only COUNTED tables (synthetic_seed refuses
          # prod-looking names) — the dump was schema-only and the drill's
          # admin-RBAC check could never pass. dev_seed is designed for
          # exactly this (proven in load.yml).
          DEV_DEMO_PASSCODE=dr-drill-demo-passcode \
            python -m app.scripts.dev_seed --confirm-dev-seed

      - name: Create a backup (pg_dump)
        run: |
          mkdir -p backend/backups
          cd backend
          # The archive name MUST match the published-backup allowlist in
          # app/scripts/dr_drill.py find_latest_backup() (backup_*.db,
          # backup_*.db.gz, backup_*.db.*.gz — same as
          # BackupService.list_backups()). The previous name
          # backup_ci_test.dump was invisible to discovery, so the drill
          # aborted with exit 2 "No backup files found" on every run after
          # #3888 tightened the pattern (2026-11-08 run 42473705759,
          # issue #3933). Gzipping mirrors the production published format
          # (.db.gz) so the weekly drill also exercises the BR-016
          # decompress-then-pg_restore path instead of bypassing it.
          PGPASSWORD=clinic_ci_only_password pg_dump \
            -h localhost -p 5432 -U clinic -d clinicdb \
            -F c -f backups/backup_ci_test.db
          gzip -f backups/backup_ci_test.db
          ls -lh backups/

      - name: Run DR drill
        env:
          BACKUP_FILE: ${{ github.event.inputs.backup_file || '' }}
        run: |
          cd backend
          # The drill will:
          # 1. Find latest backup in backups/
          # 2. Create clinic_dr_drill DB
          # 3. pg_restore into it
          # 4. Smoke test users/appointments/services/audit_log tables
          # 5. Drop clinic_dr_drill
          if [ -n "$BACKUP_FILE" ]; then
            BACKUP_FILE="$BACKUP_FILE" python -m app.scripts.dr_drill
          else
            python -m app.scripts.dr_drill
          fi

  # Canonical R1 notifier (the previous inline issues.create failed silently
  # with 403: workflow grants only contents:read; issue creation needs
  # issues:write — granted job-scoped here). Alert on failure for both
  # scheduled and manual drills; only a completed run provides restore proof.
  notify-failure:
    name: 🔔 Notify on failure
    runs-on: ubuntu-latest
    needs: [dr-drill]
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Create failure issue
        uses: ./.github/actions/notify-failure
        with:
          title: 🔴 DR Drill failed — recovery rehearsal not verified
          detail: |
            This workflow rehearses recovery in an isolated CI database. By default
            it restores a synthetic archive created in this run. A failed run by
            itself does not establish that a production backup is damaged.

            Check the first failed step:
            - Runner, Python, dependencies, migration, seed, or pg_dump: restore was not exercised.
            - Run DR drill: inspect archive selection, pg_restore, smoke checks, and cleanup
              to identify the failure; do not infer the cause from the job status alone.

            Close only after a successful run demonstrates dump, restore, smoke checks,
            and cleanup. Production-backup recoverability requires separate evidence.
