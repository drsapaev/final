name: Dependabot auto-merge (controlled)

# Managed Dependabot flow (2026-09-27; hardened 2026-09-28 after the
# retrospective review of #3495):
#   security updates  -> manual, priority review      (routed to deps-needs-triage)
#   grouped patch/minor (npm frontend + root)          -> auto-merge, gated on required checks
#   individual minors, majors, actions, docker, pip    -> manual (routed to deps-needs-triage)
#
# Hardening from the #3495 review:
#   - P1 fail-closed file guard: an API error, an empty file list, or ANY
#     file outside the manifest allowlist routes the PR to the manual queue
#     (and disables auto-merge if it was already enabled). No "|| true" on
#     the success path - every doubt is fail-closed.
#   - P2 the guard re-runs on synchronize: a PR that stops matching the
#     allowlist loses auto-merge eligibility (auto-merge switched OFF).
#
# Why pull_request_target: Dependabot PRs get a read-only GITHUB_TOKEN under
# plain pull_request, so enabling auto-merge needs the base-context token.
# This workflow NEVER checks out PR code and never executes it - it only
# reads the PR title and file list through the API and calls gh pr merge.
# Workflow code always comes from the base branch (main), not the PR.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  classify-and-route:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'drsapaev/final' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main'
    steps:
      - name: Classify PR against the auto-merge allowlist
        id: classify
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Allowlist: grouped npm patch/minor PRs only. Groups are
          # patch/minor-only BY CONFIG (dependabot.yml update-types), and key
          # frameworks are excluded from groups, so a matching title implies
          # the low-risk class the owner authorized for automation.
          case "$TITLE" in
            *"bump the frontend-npm-minor-patch group"*|*"bump the root-npm-minor-patch group"*)
              echo "verdict=automerge" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "verdict=triage" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fail-closed file guard (re-checked on every synchronize)
        id: guard
        if: steps.classify.outputs.verdict == 'automerge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A grouped npm PR may only change package.json / package-lock.json
          # in frontend/ or the repo root. Any doubt (API error, empty list,
          # unexpected file) is fail-closed: files_ok=false -> manual queue.
          allow_re='^(frontend/)?(package\.json|package-lock\.json)$'
          if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename'); then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=api_error" >> "$GITHUB_OUTPUT"
          elif [ -z "$files" ]; then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=empty_file_list" >> "$GITHUB_OUTPUT"
          elif unexpected=$(printf '%s\n' "$files" | grep -vE "$allow_re"); then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=unexpected_files" >> "$GITHUB_OUTPUT"
            echo "Unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
          else
            echo "files_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide action
        id: decide
        env:
          VERDICT: ${{ steps.classify.outputs.verdict }}
          FILES_OK: ${{ steps.guard.outputs.files_ok }}
          EVENT: ${{ github.event.action }}
        run: |
          # enable             - first classification passed: switch auto-merge ON
          # none               - synchronize, still eligible: keep auto-merge as is
          # disable_and_triage - guard failed: switch auto-merge OFF (if on), manual queue
          # triage             - outside the allowlist: manual queue (never enabled)
          if [ "$VERDICT" = "triage" ]; then
            echo "action=triage" >> "$GITHUB_OUTPUT"
          elif [ "$FILES_OK" != "true" ]; then
            echo "action=disable_and_triage" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "synchronize" ]; then
            echo "action=none" >> "$GITHUB_OUTPUT"
          else
            echo "action=enable" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge (squash, merge gated by branch protection)
        if: steps.decide.outputs.action == 'enable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # The merge itself is performed by GitHub only after every required
          # status check passes on an up-to-date branch (branch protection on
          # main is strict). This step never merges directly.
          gh pr merge --auto --squash "$PR_URL"
          gh pr comment "$PR_URL" --body "Auto-merge enabled (grouped npm patch/minor flow). Will merge when all required checks pass on an up-to-date branch."

      - name: Keep auto-merge (synchronize, still eligible)
        if: steps.decide.outputs.action == 'none'
        run: |
          echo "PR still matches the allowlist after synchronize - auto-merge stays as configured."

      - name: Fail-closed - disable auto-merge and route to manual triage
        if: steps.decide.outputs.action == 'disable_and_triage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.guard.outputs.reason }}
        run: |
          # Harmless if auto-merge was never enabled; decisive when a
          # synchronize broke the allowlist on an already-enabled PR.
          gh pr merge --disable-auto "$PR_URL" || true
          gh pr edit "$PR_URL" --add-label deps-needs-triage || true
          gh pr comment "$PR_URL" --body "Auto-merge blocked by the fail-closed file guard (reason: \`${REASON}\`). Auto-merge is disabled (if it was enabled) and the PR is routed to the manual triage queue per the managed Dependabot flow. Tracking: 'Dependabot manual-review queue' issue."

      - name: Route to the manual triage queue (outside allowlist)
        if: steps.decide.outputs.action == 'triage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT: ${{ github.event.action }}
        run: |
          gh pr edit "$PR_URL" --add-label deps-needs-triage || true
          # Comment on first classification only - Dependabot rebases often,
          # and a comment on every synchronize would be spam.
          if [ "$EVENT" != "synchronize" ]; then
            gh pr comment "$PR_URL" --body "Routed to the manual triage queue (\`deps-needs-triage\`): not in the auto-merge allowlist. Allowed for automation are grouped npm patch/minor PRs only; security bumps, individual minor/major bumps, actions, docker and pip requirement changes get a manual decision per the managed Dependabot flow. Tracking: 'Dependabot manual-review queue' issue."
          fi
