name: Archify Skill Smoke Test

on:
  pull_request:
    paths:
      - '.agents/skills/archify/**'
      - '.github/workflows/archify-skill.yml'
      - '.gitignore'
  push:
    branches:
      - main
    paths:
      - '.agents/skills/archify/**'
      - '.github/workflows/archify-skill.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-smoke:
    name: Portable package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run portable smoke suite
        working-directory: .agents/skills/archify
        run: npm test
