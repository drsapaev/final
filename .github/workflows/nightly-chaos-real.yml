name: Nightly Chaos — Real Injection (issue #2774)

on:
  schedule:
    # Nightly, offset from nightly-health (05:00 UTC) so its summary
    # can pick up this run's rows the same night.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Contract: docs/runbooks/CHAOS_REAL_INJECTION_CONTRACT.md
# S1/S2/S3 run ONLY against this CI stack. Never production.
# Mock-based chaos.yml is untouched. S4 (production-host drills) is
# manual-only by contract and is NOT implemented here.
jobs:
  chaos-real:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clinicdb
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinicdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic_ci_only_password@localhost:5432/clinicdb
      CORS_DISABLE: '1'
      WS_DEV_ALLOW: '1'
      TESTING: '1'
      PYTHONUTF8: '1'
      DEV_DEMO_PASSCODE: chaos-ci-demo-passcode

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js (k6)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install k6
        run: |
          K6_VER=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/grafana/k6/releases/latest | grep -oE '"tag_name": *"[^"]+"' | cut -d'"' -f4)
          curl -sL -o /tmp/k6.deb "https://github.com/grafana/k6/releases/download/${K6_VER}/k6-${K6_VER}-linux-amd64.deb"
          sudo dpkg -i /tmp/k6.deb
          k6 version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bring-up (postgres readiness → alembic → uvicorn → seed → JWT)
        working-directory: backend
        run: |
          python - <<'PY'
          import os, time
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          for i in range(30):
              try:
                  with engine.connect() as conn:
                      conn.execute(text("SELECT 1"))
                  print("postgres ready"); break
              except Exception as e:
                  if i == 29: raise
                  print(f"attempt {i+1}/30: {e}"); time.sleep(2)
          PY
          alembic upgrade head
          alembic current
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18000/api/v1/health >/dev/null 2>&1 && { echo "api ready"; exit 0; }
            sleep 2
          done
          echo "api readiness failed"; tail -50 /tmp/uvicorn.log; exit 1

      - name: Seed + mint TEST_JWT + resolve load target
        working-directory: backend
        run: |
          python -m app.scripts.dev_seed --confirm-dev-seed
          TEST_JWT=$(CONFIRM_MINT_DEV_TOKEN=1 MINT_DEV_TOKEN_SUBJECT=admin@example.com MINT_DEV_TOKEN_EXPIRES_MINUTES=45 python -m app.scripts.mint_dev_token)
          [ -n "$TEST_JWT" ] || { echo "no token minted"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TEST_JWT}" http://127.0.0.1:18000/api/v1/auth/me)
          [ "$code" = "200" ] || { echo "minted token rejected ($code)"; exit 1; }
          echo "TEST_JWT=$TEST_JWT" >> "$GITHUB_ENV"
          SPECIALIST_ID=$(python - <<'PY'
          from app.db.session import SessionLocal
          from app.models.user import User
          db = SessionLocal()
          try:
              doctor = db.query(User).filter(User.role == "Doctor").order_by(User.id.asc()).first()
              if doctor is None: raise SystemExit("no Doctor user after seed")
              print(doctor.id)
          finally:
              db.close()
          PY
          )
          echo "SPECIALIST_ID=$SPECIALIST_ID" >> "$GITHUB_ENV"

      # ================= S1: uvicorn kill =================
      - name: S1 — snapshot committed writes (before kill)
        working-directory: backend
        run: |
          python - <<'PY'
          from app.db.session import SessionLocal
          from sqlalchemy import text
          db = SessionLocal()
          n = db.execute(text("SELECT COUNT(*) FROM visits")).scalar()
          print(f"S1_BEFORE_VISITS={n}")
          open("/tmp/s1_before.txt", "w").write(str(n))
          db.close()
          PY
          echo "S1_BEFORE_VISITS=$(cat /tmp/s1_before.txt)" >> "$GITHUB_ENV"

      - name: S1 — inject uvicorn SIGKILL under k6 load
        id: s1
        working-directory: tests/load
        timeout-minutes: 8
        continue-on-error: true
        run: |
          # Observer load keeps issuing requests while the workflow kills
          # uvicorn mid-run (~30s in), waits 5s, restarts it. Contract:
          # failures FAST (≤10s ceiling — no hangs), restart → 200 ≤30s.
          CHAOS_CEILING_MS=10000 CHAOS_DURATION=2m \
          k6 run k6-chaos-real.js \
            --env BASE_URL=http://127.0.0.1:18000 \
            --env TEST_JWT="${TEST_JWT}" \
            --env SPECIALIST_ID="${SPECIALIST_ID}" \
            --out json=/tmp/s1-k6.json \
            > /tmp/s1-k6.log 2>&1 &
          K6_PID=$!
          sleep 30
          UVICORN_PID=$(cat /tmp/uvicorn.pid)
          echo "S1: killing uvicorn pid=$UVICORN_PID"
          kill -9 "$UVICORN_PID"
          sleep 5
          cd "$GITHUB_WORKSPACE/backend"
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18000 >> /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:18000/api/v1/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18000/api/v1/health >/dev/null || { echo "no recovery"; exit 1; }
          wait $K6_PID || true

      - name: S1 — evaluate contract assertions
        id: s1_eval
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: postgresql+psycopg://clinic:clinic_ci_only_password@localhost:5432/clinicdb
        run: |
          python "$GITHUB_WORKSPACE/tests/load/chaos_eval.py" \
            --k6-json /tmp/s1-k6.json \
            --ceiling-ms 10000 \
            --before-file /tmp/s1_before.txt \
            --after-count visits \
            --scenario "S1 uvicorn kill"

      - name: S1 — post-recovery snapshot
        working-directory: backend
        run: |
          python - <<'PY'
          from app.db.session import SessionLocal
          from sqlalchemy import text
          db = SessionLocal()
          n = db.execute(text("SELECT COUNT(*) FROM visits")).scalar()
          print(f"S1_AFTER_VISITS={n}")
          open("/tmp/s1_after.txt", "w").write(str(n))
          db.close()
          PY

      # ================= S2: postgres sever 60s =================
      - name: S2 — snapshot committed writes (before sever)
        working-directory: backend
        run: |
          python - <<'PY'
          from app.db.session import SessionLocal
          from sqlalchemy import text
          db = SessionLocal()
          print(f"S2_BEFORE_VISITS={db.execute(text('SELECT COUNT(*) FROM visits')).scalar()}")
          db.close()
          PY
          docker stop "$(docker ps -qf name=postgres)"

      - name: S2 — 60s sever under k6 load
        id: s2
        working-directory: tests/load
        timeout-minutes: 8
        continue-on-error: true
        run: |
          CHAOS_CEILING_MS=15000 CHAOS_DURATION=2m30s \
          k6 run k6-chaos-real.js \
            --env BASE_URL=http://127.0.0.1:18000 \
            --env TEST_JWT="${TEST_JWT}" \
            --env SPECIALIST_ID="${SPECIALIST_ID}" \
            --out json=/tmp/s2-k6.json \
            > /tmp/s2-k6.log 2>&1 &
          K6_PID=$!
          echo "S2: severing postgres for 60s"
          docker stop "$(docker ps -aqf name=postgres)"
          sleep 60
          docker start "$(docker ps -aqf name=postgres)"
          sleep 5
          wait $K6_PID || true

      - name: S2 — evaluate contract assertions
        id: s2_eval
        continue-on-error: true
        run: |
          python "$GITHUB_WORKSPACE/tests/load/chaos_eval.py" \
            --k6-json /tmp/s2-k6.json \
            --ceiling-ms 15000 \
            --scenario "S2 postgres sever 60s"

      - name: S2 — pool self-recovery proof (≤30s, no app restart)
        working-directory: backend
        run: |
          UVICORN_PID=$(cat /tmp/uvicorn.pid)
          ALIVE=$(ps -p "$UVICORN_PID" > /dev/null && echo yes || echo no)
          [ "$ALIVE" = "yes" ] || { echo "❌ uvicorn died during sever"; exit 1; }
          python - <<'PY'
          import time, urllib.request
          t0 = time.time()
          for _ in range(15):
              try:
                  urllib.request.urlopen("http://127.0.0.1:18000/api/v1/health", timeout=10)
                  print(f"pool recovered in {time.time()-t0:.1f}s"); break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("pool did not self-recover in 30s")
          PY

      # ================= S3: cold-start baseline =================
      - name: S3 — cold restart of the full stack
        id: s3
        timeout-minutes: 10
        run: |
          kill -9 $(cat /tmp/uvicorn.pid) 2>/dev/null || true
          docker stop "$(docker ps -aqf name=postgres)" && docker rm "$(docker ps -aqf name=postgres)"
          # Cold start = FRESH postgres container (contract: no volume
          # carry-over) + the same credentials/port the job was given.
          docker run -d --name postgres-cold             -e POSTGRES_DB=clinicdb -e POSTGRES_USER=clinic             -e POSTGRES_PASSWORD=clinic_ci_only_password             -p 5432:5432 postgres:16
          cd backend
          for i in $(seq 1 30); do
            docker exec postgres-cold pg_isready -U clinic -d clinicdb >/dev/null 2>&1 && break
            sleep 2
          done
          python - <<'PY'
          import os, time
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          for i in range(30):
              try:
                  with engine.connect() as conn:
                      conn.execute(text("SELECT 1"))
                  break
              except Exception as e:
                  if i == 29: raise
                  time.sleep(2)
          PY
          # Convergence proof: a fresh container DB runs the full chain;
          # a drifted database would fail the upgrade itself.
          alembic upgrade head || { echo "alembic upgrade failed on cold DB"; exit 1; }
          alembic current > /tmp/s3_current.txt 2>&1
          grep -q "(head)" /tmp/s3_current.txt || { echo "alembic did not reach head"; cat /tmp/s3_current.txt; exit 1; }
          echo "alembic converged to head"
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18000/api/v1/health >/dev/null 2>&1 && { echo "api ready (cold)"; exit 0; }
            sleep 2
          done
          echo "cold start failed"; tail -30 /tmp/uvicorn.log; exit 1

      - name: S3 — seed idempotency + k6 smoke stage
        id: s3_eval
        working-directory: backend
        run: |
          USERS=$(python - <<'PY'
          from app.db.session import SessionLocal
          from app.models.user import User
          db = SessionLocal()
          print(db.query(User).filter(User.username.like("admin%")).count())
          db.close()
          PY
          )
          echo "S3_ADMIN_USERS=$USERS" >> "$GITHUB_ENV"
          [ "$USERS" -le 1 ] || { echo "❌ seed duplicated admin users: $USERS"; exit 1; }
          # Contract: seed idempotent — re-run on the fresh container so the
          # seeded user exists for the k6 smoke stage.
          python -m app.scripts.dev_seed --confirm-dev-seed
          cd "$GITHUB_WORKSPACE/tests/load"
          k6 run k6-queue-load.js --stage 30s:10 --env BASE_URL=http://127.0.0.1:18000 --env TEST_JWT="${TEST_JWT}" --env SPECIALIST_ID="${SPECIALIST_ID}" --out json=/tmp/s3-k6.json > /tmp/s3-k6.log 2>&1
          ERRORS=$(grep -oE '"value":[0-9.]+' /tmp/s3-k6.json | tail -1)
          echo "S3 smoke done"

      # ================= Evidence + R1 =================
      - name: Collect artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-real-evidence
          path: |
            /tmp/s*-k6.json
            /tmp/s*-k6.log
          retention-days: 30
        continue-on-error: true

      - name: Write summary (nightly-health consumes this)
        if: always()
        run: |
          {
            echo "## chaos-real (real-injection) — run ${{ github.run_id }}"
            echo ""
            echo "| Scenario | Injection | Result |"
            echo "|---|---|---|---|"
            echo "| chaos-real (S1 uvicorn) | kill -9 mid-load | ${{ steps.s1.outcome }} |"
            echo "| chaos-real (S2 postgres-sever) | 60s docker stop | ${{ steps.s2.outcome }} |"
            echo "| chaos-real (S3 cold-start) | full stack restart | ${{ steps.s3.outcome }} |"
            echo ""
            echo "All rows are **real-injection** (issue #2774)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: R1 — create or update the ci-failure issue (idempotent)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="chaos-real: nightly real-injection run FAILED"
          MARKER="<!-- chaos-real-r1 -->"
          EXISTING=$(gh issue list --state open --search "$MARKER in:title" --json number --jq '.[0].number' || true)
          BODY="$MARKER
          Real-injection chaos run failed (contract: docs/runbooks/CHAOS_REAL_INJECTION_CONTRACT.md).
          Run: $RUN_URL
          Scenario outcomes are in the run summary. This issue is updated in place on repeated failures (idempotent R1)."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
