name: Review repair sandbox

on:
  push:
    branches: [cloud/review-repair-20260916]
    paths:
      - .github/workflows/cloud-review-repair.yml
      - scripts/cloud_review_repair/config.json

permissions:
  contents: read

concurrency:
  group: cloud-review-repair-20260916
  cancel-in-progress: false

jobs:
  configuration:
    if: github.repository == 'drsapaev/final' && github.ref == 'refs/heads/cloud/review-repair-20260916'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      kind: ${{ steps.config.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: config
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = Path('scripts/cloud_review_repair/config.json')
          cfg = json.loads(path.read_text()) if path.exists() else {'enabled': False}
          kind = cfg.get('kind', 'backend')
          assert kind in {'backend', 'frontend', 'powershell'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('enabled=' + str(bool(cfg.get('enabled'))).lower(), file=f)
              print('kind=' + kind, file=f)

  repair:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: review_ci_only
          POSTGRES_DB: clinicdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinic -d clinicdb"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinic:review_ci_only@127.0.0.1:5432/clinicdb
      ARQ_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_IDEMPOTENCY_REDIS_URL: redis://127.0.0.1:6379/15
      RQ09B_PG_ADMIN_URL: postgresql://clinic:review_ci_only@127.0.0.1:5432/postgres
      TEST_REVIEW_PG_ADMIN_URL: postgresql://clinic:review_ci_only@127.0.0.1:5432/postgres
      ENV: dev
      TESTING: '1'
      CORS_DISABLE: '1'
      WS_DEV_ALLOW: '1'
      SENTRY_DSN: ''
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Prepare fresh isolated product tree
        run: python scripts/cloud_review_repair/runner.py prepare
      - name: Install backend and regression-test dependencies
        working-directory: ${{ runner.temp }}/product/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov pytest-asyncio pytest-deadfixtures httpx ruff
      - uses: actions/setup-node@v6
        if: needs.configuration.outputs.kind == 'frontend'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: needs.configuration.outputs.kind == 'frontend'
        working-directory: ${{ runner.temp }}/product/frontend
        run: npm ci
      - name: Install isolated browser
        if: needs.configuration.outputs.kind == 'frontend'
        working-directory: ${{ runner.temp }}/product/frontend
        run: npx playwright install --with-deps chromium
      - name: Fail-first repair, regression tests and exact scope proof
        run: python scripts/cloud_review_repair/runner.py validate
      - name: Publish verified feature branch (never main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cloud_review_repair/runner.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repair-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          if-no-files-found: error
