name: Chaos Testing (Weekly)

on:
  schedule:
    # Every Sunday at 4:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Phase 1: failure injection → Phase 2: recovery → Phase 3: post-recovery verification
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # === Phase 1: Failure Injection ===
      - name: Phase 1 — Run chaos tests (failure injection)
        working-directory: frontend
        run: |
          npx playwright test e2e/chaos/ \
            --reporter=json \
            --output=chaos-results-phase1.json \
            2>&1 | tee chaos-output-phase1.txt
        continue-on-error: true
        env:
          CI: true

      - name: Phase 1 results
        run: |
          echo "=== Phase 1: Failure Injection ==="
          cat frontend/chaos-output-phase1.txt || echo "No output"
          echo ""

      # === Phase 2: Recovery Verification ===
      - name: Phase 2 — Run chaos tests (recovery verification)
        working-directory: frontend
        run: |
          # Re-run chaos tests to verify recovery — all should pass now
          # (mock routes simulate backend coming back online)
          npx playwright test e2e/chaos/ \
            --reporter=json \
            --output=chaos-results-phase2.json \
            2>&1 | tee chaos-output-phase2.txt
        env:
          CI: true

      - name: Phase 2 results
        run: |
          echo "=== Phase 2: Recovery Verification ==="
          cat frontend/chaos-output-phase2.txt || echo "No output"
          echo ""

      # === Phase 3: Post-Recovery Correctness ===
      - name: Phase 3 — Run smoke tests (post-recovery correctness)
        working-directory: frontend
        run: |
          # Run basic E2E tests to verify system is fully functional after recovery
          npx playwright test e2e/business/01-appointment-booking.spec.ts \
            --reporter=json \
            2>&1 | tee chaos-output-phase3.txt
        env:
          CI: true

      - name: Phase 3 results
        run: |
          echo "=== Phase 3: Post-Recovery Correctness ==="
          cat frontend/chaos-output-phase3.txt || echo "No output"
          echo ""

      - name: Upload chaos results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results
          path: |
            frontend/chaos-output-*.txt
            frontend/chaos-results-*.json
