name: Load Testing (Weekly)

on:
  schedule:
    # Every Sunday at 3:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Environment contract: docs/runbooks/LOAD_CHAOS_ENVIRONMENT.md
# (readiness proofs are hard gates; vacuous runs must fail, not pass)
jobs:
  load-test:
    # Use self-hosted runner for consistent performance metrics.
    # Fallback to ubuntu-latest if no self-hosted runner available.
    runs-on: ${{ vars.LOAD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clinicdb
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinicdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic_ci_only_password@localhost:5432/clinicdb
      CORS_DISABLE: '1'
      WS_DEV_ALLOW: '1'
      TESTING: '1'
      PYTHONUTF8: '1'
      # Deterministic seed passcode for the load-test user; not a secret
      # (CI-only database with synthetic data).
      DEV_DEMO_PASSCODE: load-ci-demo-passcode
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install k6
        run: |
          # The old apt+keyserver method fails on GitHub runners with
          # "gpg: keyserver receive failed: No data" (broken for weeks);
          # Grafana's master install.sh is gone (404) too. Install the
          # official .deb from the latest GitHub release.
          # Codex review follow-up: authenticate the release lookup (avoids
          # API rate limits) and keep the version overridable via env.
          K6_VER="${K6_VERSION:-}"
          if [ -z "$K6_VER" ]; then
            K6_VER=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/grafana/k6/releases/latest | grep -oE '"tag_name": *"[^"]+"' | cut -d'"' -f4)
          fi
          curl -sL -o /tmp/k6.deb "https://github.com/grafana/k6/releases/download/${K6_VER}/k6-${K6_VER}-linux-amd64.deb"
          sudo dpkg -i /tmp/k6.deb
          k6 version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres + apply migrations (readiness gate)
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          import time
          from sqlalchemy import create_engine, text

          url = os.environ["DATABASE_URL"]
          engine = create_engine(url)
          for i in range(30):
              try:
                  with engine.connect() as conn:
                      conn.execute(text("SELECT 1"))
                  print("✅ Postgres ready")
                  break
              except Exception as e:
                  if i == 29:
                      raise
                  print(f"Attempt {i + 1}/30: {e}")
                  time.sleep(2)
          PY
          alembic upgrade head
          alembic current

      - name: Start API + readiness proof (/health, hard gate)
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1 \
               || curl -sf http://127.0.0.1:8000/api/v1/health/detailed >/dev/null 2>&1; then
              echo "✅ API ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ API failed readiness within 60s; uvicorn log tail:"
          tail -50 /tmp/uvicorn.log
          exit 1

      - name: Seed demo users + mint TEST_JWT
        working-directory: backend
        run: |
          python -m app.scripts.dev_seed --confirm-dev-seed
          TEST_JWT=$(CONFIRM_MINT_DEV_TOKEN=1 \
            MINT_DEV_TOKEN_SUBJECT=admin@example.com \
            MINT_DEV_TOKEN_EXPIRES_MINUTES=30 \
            python -m app.scripts.mint_dev_token)
          if [ -z "$TEST_JWT" ]; then
            echo "❌ Token minting returned nothing"; exit 1
          fi
          # Validate the token against the live API before handing it to k6.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TEST_JWT}" \
            http://127.0.0.1:8000/api/v1/auth/me)
          if [ "$code" != "200" ]; then
            echo "❌ Minted token rejected by /auth/me (HTTP $code)"; exit 1
          fi
          echo "✅ TEST_JWT minted and verified"
          echo "TEST_JWT=$TEST_JWT" >> "$GITHUB_ENV"

          # Deterministic specialist id for the queue-status load target.
          SPECIALIST_ID=$(python - <<'PY'
          from app.db.session import SessionLocal
          from app.models.user import User

          db = SessionLocal()
          try:
              doctor = db.query(User).filter(User.role == "Doctor").order_by(User.id.asc()).first()
              if doctor is None:
                  raise SystemExit("No Doctor user found after dev_seed")
              print(doctor.id)
          finally:
              db.close()
          PY
          )
          echo "SPECIALIST_ID=$SPECIALIST_ID (validated below)"
          # The load target must exist and accept the token before k6 starts.
          qcode=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TEST_JWT}" \
            "http://127.0.0.1:8000/api/v1/queue/status/${SPECIALIST_ID}")
          if [ "$qcode" != "200" ]; then
            echo "❌ Queue load target rejected (HTTP $qcode) — refusing vacuous run"; exit 1
          fi
          echo "SPECIALIST_ID=$SPECIALIST_ID" >> "$GITHUB_ENV"

      - name: Check runner type
        id: runner
        run: |
          # GitHub-hosted runner names are "GitHub Actions <id>" (the old
          # equality check never matched and misclassified hosted runners
          # as self-hosted — which also silently enabled the baseline gate).
          case "${{ runner.name }}" in
            "GitHub Actions"*)
              echo "is_reference=true" >> $GITHUB_OUTPUT
              echo "ENFORCE_LATENCY=false" >> $GITHUB_ENV
              echo "⚠️ GitHub-hosted runner — latency thresholds informational; error-rate gate enforced"
              ;;
            *)
              echo "is_reference=false" >> $GITHUB_OUTPUT
              echo "ENFORCE_LATENCY=true" >> $GITHUB_ENV
              echo "✅ Self-hosted runner — full threshold enforcement"
              ;;
          esac

      - name: Run k6 — Queue load test
        working-directory: tests/load
        run: |
          k6 run k6-queue-load.js \
            --out json=queue-results.json \
            --env BASE_URL=http://localhost:8000 \
            --env TEST_JWT="${TEST_JWT}" \
            --env SPECIALIST_ID="${SPECIALIST_ID}" \
            --env ENFORCE_LATENCY="${ENFORCE_LATENCY}"

      - name: Run k6 — EMR load test
        working-directory: tests/load
        run: |
          k6 run k6-emr-load.js \
            --out json=emr-results.json \
            --env BASE_URL=http://localhost:8000 \
            --env TEST_JWT="${TEST_JWT}" \
            --env ENFORCE_LATENCY="${ENFORCE_LATENCY}"

      - name: Parse k6 results (fail if no results)
        run: |
          test -s tests/load/queue-results.json || { echo "❌ queue-results.json missing/empty — vacuous run"; exit 1; }
          test -s tests/load/emr-results.json || { echo "❌ emr-results.json missing/empty — vacuous run"; exit 1; }
          node -e "
          const fs = require('fs');
          // k6 outputs NDJSON (one JSON object per line), not a JSON array.
          // Parse line-by-line to handle this correctly.
          function parseK6NDJSON(filepath) {
            const lines = fs.readFileSync(filepath, 'utf8').trim().split('\n');
            return lines.map(line => JSON.parse(line));
          }
          const queue = parseK6NDJSON('tests/load/queue-results.json');
          const emr = parseK6NDJSON('tests/load/emr-results.json');

          function extractP95(data) {
            const durations = data
              .filter(d => d.metric === 'http_req_duration')
              .map(d => d.data.value);
            durations.sort((a, b) => a - b);
            const idx = Math.ceil(durations.length * 0.95) - 1;
            return durations[idx] || 0;
          }

          const results = {
            queue: { p95_ms: Math.round(extractP95(queue)) },
            emr: { p95_ms: Math.round(extractP95(emr)) },
          };
          fs.writeFileSync('tests/load/k6-parsed-results.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          "

      - name: Baseline check (fail on >15% degradation)
        if: steps.runner.outputs.is_reference != 'true'
        run: |
          node scripts/load-baseline-check.mjs \
            --results tests/load/k6-parsed-results.json \
            --baseline e2e/k6/baseline.json

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/uvicorn.pid ]; then kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true; fi

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: tests/load/*-results.json
          if-no-files-found: error

  # Alert on scheduled-run failures: a red nightly is invisible without this
  # (mutation.yml was red for 4+ nights before anyone noticed).
  notify-failure:
    name: 🔔 Notify on failure
    runs-on: ubuntu-latest
    needs: [load-test]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create failure issue
        uses: ./.github/actions/notify-failure
        with:
          title: "🔴 Weekly load testing failed"
          detail: |
            k6 load tests with baseline degradation gate (>15% p95 regression fails).
            Environment contract: docs/runbooks/LOAD_CHAOS_ENVIRONMENT.md
