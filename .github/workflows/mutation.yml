name: Mutation Testing (Nightly)

on:
  schedule:
    # Every night at 2:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # === Backend (Python) — mutmut ===
  backend-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -e . mutmut

      - name: Run mutmut on critical modules
        working-directory: backend
        run: |
          mutmut run \
            --paths-to-mutate app/services/appointments.py,app/services/payments.py,app/services/queue.py,app/services/emr.py \
            2>&1 | tee mutmut-output.txt

      - name: Parse mutation score
        run: |
          python3 scripts/parse-mutmut-score.py \
            --output backend/mutmut-output.txt \
            --threshold 80

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: backend/html/

  # === Frontend (TypeScript) — Stryker ===
  frontend-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Stryker
        working-directory: frontend
        run: npm install --save-dev @stryker-mutator/core @stryker-mutator/vitest-runner

      - name: Run Stryker
        working-directory: frontend
        run: npx stryker run --configFile stryker.config.mjs
        continue-on-error: true

      - name: Parse mutation score
        run: |
          node scripts/parse-stryker-score.js \
            --output frontend/reports/mutation/mutation.json \
            --threshold 70 || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: frontend/reports/mutation/
