name: Mutation Testing (Nightly)

on:
  schedule:
    # Every night at 2:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # === Backend (Python) — mutmut ===
  backend-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Backend suite requires PostgreSQL (same setup as backend-tests job
    # in ci-cd-unified.yml): mutmut runs the full suite for stats collection.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clinicdb
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinicdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic_ci_only_password@localhost:5432/clinicdb
      CORS_DISABLE: '1'
      WS_DEV_ALLOW: '1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
          # Pinned: mutmut 3 removed the --paths-to-mutate CLI flag this job
          # used before; config now lives in backend/pyproject.toml [tool.mutmut].
          pip install mutmut==3.7.0

      - name: Wait for Postgres + apply migrations
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          import time
          from sqlalchemy import create_engine, text

          url = os.environ["DATABASE_URL"]
          engine = create_engine(url)
          for i in range(30):
              try:
                  with engine.connect() as conn:
                      conn.execute(text("SELECT 1"))
                  print("✅ Postgres ready")
                  break
              except Exception as e:
                  if i == 29:
                      raise
                  print(f"Attempt {i + 1}/30: {e}")
                  time.sleep(2)
          PY
          alembic upgrade head

      - name: Run mutmut on critical modules
        working-directory: backend
        run: |
          # pipefail: without it the step exit code came from `tee`, and a
          # crashed mutmut looked like a green step (observed on main).
          set -o pipefail
          mutmut run 2>&1 | tee mutmut-output.txt

      - name: Parse mutation score
        run: |
          # Threshold is a regression ratchet, not an aspiration: the first
          # real measurement (2026-08-14, run 31827623807) scored 34.5%
          # (132 killed / 251 survived / 391 no_tests of 774 mutants on the
          # four crud modules). Floor 30 catches degradation; ratchet upward
          # as crud unit/integration coverage improves.
          python3 scripts/parse-mutmut-score.py \
            --output backend/mutmut-output.txt \
            --threshold 30

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: backend/mutmut-output.txt
          if-no-files-found: error

  # === Frontend (TypeScript) — Stryker ===
  frontend-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Stryker
        working-directory: frontend
        run: npm install --save-dev @stryker-mutator/core @stryker-mutator/vitest-runner

      - name: Run Stryker
        working-directory: frontend
        run: npx stryker run
        continue-on-error: true

      - name: Parse mutation score
        run: |
          node scripts/parse-stryker-score.js \
            --output frontend/reports/mutation/mutation.json \
            --threshold 70

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: frontend/reports/mutation/

  # Alert on scheduled-run failures: a red nightly is invisible without this
  # (mutation.yml was red for 4+ nights before anyone noticed).
  notify-failure:
    name: 🔔 Notify on failure
    runs-on: ubuntu-latest
    needs: [backend-mutation, frontend-mutation]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create failure issue
        uses: ./.github/actions/notify-failure
        with:
          title: "🔴 Nightly mutation testing failed"
          detail: |
            Guards the mutation-score floors: backend mutmut (4 crud modules, threshold 30) and frontend Stryker (state machines + mappers, threshold 70).
