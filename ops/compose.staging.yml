name: ${COMPOSE_PROJECT_NAME:-clinic-staging}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${STAGING_POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.staging
    restart: unless-stopped
    environment:
      ENV: staging
      APP_NAME: ${APP_NAME:-Clinic Manager Staging}
      APP_VERSION: ${APP_VERSION:-1.1.0-staging}
      API_V1_STR: /api/v1
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ALLOW_ALL: 0
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_DISABLE: 0
      # PR 3390 review round (P1): canonical public frontend origin for
      # user-facing deep links (password reset, PWA invitations). Without
      # this the Settings default (http://192.168.1.9:5173) leaks into links
      # sent to patients on staging.
      FRONTEND_URL: ${STAGING_PUBLIC_BASE_URL}
      TIMEZONE: ${TIMEZONE:-Asia/Tashkent}
      HOST: 0.0.0.0
      PORT: 18000
      WORKERS: ${WORKERS:-2}
      RELOAD: 0
      RUN_ALEMBIC_ON_START: 1
      ENSURE_ADMIN: 1
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
      ADMIN_RESET_PASSWORD: 0
      REQUIRE_LICENSE: 0
      LICENSE_ALLOW_HEALTH: 1
      EMR_LEGACY_WRITE_FREEZE: ${EMR_LEGACY_WRITE_FREEZE:-1}
      AUTO_BACKUP_ENABLED: 0
      BACKUP_HOUR: 2
      BACKUP_MINUTE: 0
      WS_DEV_ALLOW: 0
      ENABLE_DEV_AUTH: false
      LOG_LEVEL: INFO
      LOG_STRUCTURED: 1
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: staging
      # Codex R2 #3092 (P1): the backend itself must reach Redis for the
      # distributed idempotency claim. Without these vars the backend falls
      # back to redis://localhost:6379/0 inside its own container, the ping
      # fails, and a lost-response retry landing on the other Uvicorn worker
      # can create duplicate visits/invoices/queue entries.
      IDEMPOTENCY_REDIS_URL: ${IDEMPOTENCY_REDIS_URL:-redis://redis:6379/0}
      ARQ_REDIS_URL: ${ARQ_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ../backend:/app:rw
      - ../backend/backups:/app/backups
      - staging_backend_data:/data
    working_dir: /app
    command: ["/bin/bash", "/entrypoint.sh"]
    ports:
      # Windows production uses host port 18000; keep staging separate by default.
      - "${STAGING_BACKEND_PORT:-18001}:18000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.staging
      args:
        VITE_API_BASE: /api/v1
        VITE_API_URL: ${STAGING_PUBLIC_BASE_URL}
        VITE_API_BASE_URL: ${STAGING_PUBLIC_BASE_URL}
        VITE_WS_URL: ${STAGING_PUBLIC_WS_URL}
        VITE_WS_HOST: ${STAGING_PUBLIC_WS_HOST}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENV: staging
    restart: unless-stopped
    ports:
      - "${STAGING_FRONTEND_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Redis (for WebSocket pubsub + arq broker) — staging
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Codex R7 #3092 (P1): idempotency claims and completed-response
    # snapshots live here — allkeys-lru may EVICT either under memory
    # pressure, a same-key retry on the other worker then re-executes the
    # cart and duplicates billing/queue records. noeviction + AOF keeps
    # the idempotency state durable; if the store fills up, writes fail
    # and the backend fails CLOSED (503 idempotency_unavailable) instead
    # of executing uncoordinated keyed writes.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # arq worker — staging
  worker:
    build:
      context: ..
      dockerfile: ops/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ARQ_REDIS_URL: redis://redis:6379/0
      ENV: staging
      SECRET_KEY: ${SECRET_KEY}
      TIMEZONE: ${TIMEZONE:-Asia/Tashkent}
      # PR 3390 review round (P1): the reminder worker builds the PWA/SMS
      # visit-confirmation deep link from settings.FRONTEND_URL. Without
      # this var the worker fell back to the Settings default
      # (http://192.168.1.9:5173) instead of the actual staging frontend
      # origin — patients would receive an unreachable link.
      FRONTEND_URL: ${STAGING_PUBLIC_BASE_URL}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: staging
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      APP_VERSION: ${APP_VERSION:-0.9.0}
      LOG_STRUCTURED: 1
    volumes:
      - ../backend:/app:rw
      - staging_backend_data:/data
    working_dir: /app
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  staging_backend_data:
  staging_postgres_data:
  staging_redis_data:
